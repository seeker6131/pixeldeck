<title>Pixeldeck Battle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* PDNum: digits only (Inter, SIL OFL), listed first in every font stack so every number in the game is drawn in a plain readable face */
@font-face{font-family:"PDNum";src:url(fnt/num-Bold.woff) format("woff");font-weight:600 900;unicode-range:U+30-39,U+25,U+2B,U+2C,U+2E}
@font-face{font-family:"PDNum";src:url(fnt/num-SemiBold.woff) format("woff");font-weight:100 500;unicode-range:U+30-39,U+25,U+2B,U+2C,U+2E}

/* Layout: a landscape stage — a narrow status rail on the left, the working area (board, cards, shop) on the right. */
:root{
  color-scheme:dark;
  --night:#1d2b53; --panel:#2a3a6e; --deep:#121a36; --ink:#fff1e8; --dim:#c2c3c7;
  --red:#ff004d; --yellow:#ffec27; --green:#00e436; --blue:#29adff; --orange:#ffa300; --plum:#7e2553; --lav:#83769c;
  --st:#b08a5a; --c:#a9adb8; --uc:#3ddc5a; --r:#4aa8ff; --l:#ffd23a; --sl:#ff9d1a;
  --display:"PDNum","Pixelify Sans","Chakra Petch",system-ui,sans-serif;
  --body:"PDNum","Chakra Petch","Pixelify Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4}
/* the game is always a landscape stage; on an upright phone the stage is turned 90 degrees */
#stage{position:fixed;left:0;top:0;transform-origin:top left;padding-block:10px;padding-inline:16px;overflow:hidden}
#view{height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1{font-family:var(--display);font-size:30px;line-height:1;margin:0;color:var(--yellow);text-shadow:3px 3px 0 var(--red)}
h2{font-family:var(--display);font-size:20px;line-height:1.1;margin:0;color:var(--yellow)}
p{margin:0}
.px{border:3px solid var(--deep);background:var(--panel);box-shadow:0 4px 0 var(--deep)}
.btn{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2;padding:7px 12px;border:3px solid var(--deep);background:var(--yellow);color:var(--deep);box-shadow:0 4px 0 var(--deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.btn.alt{background:var(--panel);color:var(--ink)}
.btn.go{background:var(--red);color:var(--ink)}
.btn.sm{font-size:14px;padding:4px 8px}
.btn.on{background:var(--green);color:var(--deep)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;height:100%}
.rail{display:grid;gap:7px;align-content:start;min-height:0;overflow-y:auto;padding-bottom:6px}
.main{min-height:0;overflow-y:auto;padding:18px 20px}
.num{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.gold{color:var(--yellow)}.dia{color:var(--blue)}
.sub{font-size:12px;color:var(--dim)}
.pvsq{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;align-items:end;padding:10px 0 2px;overflow:hidden}.pvsq>span{display:block;height:46px}.pvsq .spr{height:100%;transform:scaleX(-1)}
.arenav .rail{overflow-x:hidden}
.pvh{font-family:var(--display);font-size:17px;color:#ffe45c;margin:0 0 8px}
.pvrow{display:grid;grid-template-columns:minmax(90px,1fr) auto auto;align-items:center;gap:10px;padding:6px 10px;margin-bottom:7px;border:3px solid #080b1f;background:linear-gradient(180deg,#2c3884,#1d2560);box-shadow:inset 0 2px 0 rgba(150,200,255,.25)}
.pvn{display:grid;min-width:0}.pvn b{font-family:var(--display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pvn small{font-size:11px}.pvn .bot{font-style:normal;font-size:9px;background:#5a6aa0;padding:0 4px;justify-self:start}
.pvt{display:flex;gap:5px}.pvc{position:relative;display:block;width:40px;border:2px solid var(--gl,#6f7cc0)}.pvc .art{aspect-ratio:1}.pvc i{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:9px;line-height:1.2;text-align:center;background:rgba(8,11,31,.8)}
.pvc.hid{aspect-ratio:1;display:grid;place-items:center;border-style:dashed;background:rgba(8,11,31,.6)}.pvc.hid b{font-family:var(--display);font-size:20px;color:#8f9be0}
.bn.cd{height:calc(var(--H)*.46)}.bn.cd span{font-size:calc(var(--H)*.34);line-height:1}
/* arena hub */
.pvhub{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:4px}
.pvtop{display:flex;align-items:center;gap:8px}
.pvmid{display:grid;justify-items:center;align-content:center;gap:3px;min-height:0;text-align:center}
.shd{position:relative;display:inline-grid;place-items:center;width:var(--s,60px);aspect-ratio:1}
.shd>img{position:relative;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.shd.sm{--s:46px}.shd.md{--s:calc(var(--H)*.22)}.shd.xl{--s:calc(var(--H)*.4)}.shd.xl>img{animation:shf 2.4s ease-in-out infinite alternate}
@keyframes shf{to{transform:translateY(-4px)}}
.shd.xl.t2>img,.shd.xl.t3>img,.shd.xl.t4>img,.shd.xl.t5>img{animation:shf 2.4s ease-in-out infinite alternate,shg 1.6s ease-in-out infinite alternate}
@keyframes shg{from{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 3px var(--c))}to{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 16px var(--c))}}
.shd>.sp{width:11%;z-index:3}.shd.t3>.sp{background:#bff6ff}.shd.t4>.sp{background:#e6c8ff}.shd.t5>.sp{background:#fff1a8}
.shd canvas.firec{position:absolute;z-index:auto;transform:none;image-rendering:pixelated;pointer-events:none;top:auto}
.shd canvas.shl{left:-6%;width:112%;top:-4%;height:108%;z-index:2;filter:drop-shadow(0 0 2px rgba(255,200,0,.7))}
.shd.t4 canvas.shl{filter:hue-rotate(215deg) saturate(1.3) drop-shadow(0 0 3px #b06cff)}
.shd canvas.shf{left:-4%;width:108%;bottom:10%;height:70%;opacity:.7;-webkit-mask:linear-gradient(90deg,transparent,#000 22% 78%,transparent);mask:linear-gradient(90deg,transparent,#000 22% 78%,transparent)}
.shd .rays{position:absolute;inset:-22%;border-radius:50%;background:repeating-conic-gradient(rgba(255,210,58,.5) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(closest-side,transparent 42%,#000 50%,transparent 100%);mask:radial-gradient(closest-side,transparent 42%,#000 50%,transparent 100%);animation:rsp 14s linear infinite}
@keyframes rsp{to{transform:rotate(360deg)}}
.pvname{font-family:var(--display);font-size:calc(var(--H)*.075);line-height:1;text-shadow:0 2px 0 #080b1f}
.rst.big{font-size:calc(var(--H)*.075);line-height:1;letter-spacing:4px;text-shadow:0 2px 0 #080b1f}
.pvfight{min-width:190px;font-size:22px;letter-spacing:.12em;margin:4px 0 2px}
.pvhub.list{grid-template-rows:auto minmax(0,1fr)}.pvlist{overflow-y:auto;padding:4px 6px 8px;min-height:0}
.rkrow{position:relative;display:grid;grid-template-columns:auto minmax(90px,1.2fr) 1fr 1fr 1fr;align-items:center;gap:12px;padding:5px 12px;margin-bottom:6px;border:3px solid #080b1f;background:linear-gradient(180deg,#2c3884,#1d2560);box-shadow:inset 0 2px 0 rgba(150,200,255,.25)}
.rkrow.me{outline:3px solid #ffe45c;outline-offset:-1px}.rkrow .you{position:absolute;right:6px;top:-9px;font-style:normal;font-size:9px;background:#ffe45c;color:#121a36;padding:0 5px;font-weight:700}
.rkn,.rkd{display:grid;line-height:1.2}.rkn b{font-family:var(--display);font-size:17px}.rkn small,.rkd small{font-size:10px;color:#aeb9ee}.rkd{font-family:var(--display);font-size:13px;color:#ffe9a8}
@media (prefers-reduced-motion:reduce){.shd.xl>img,.shd .rays{animation:none!important}}
.acn{display:inline-flex;align-items:center;gap:3px;color:#d9b8ff;font-weight:700;vertical-align:middle}.acn img{width:17px;height:17px;image-rendering:auto}
.rst{letter-spacing:1px;white-space:nowrap}.rst i{font-style:normal;color:rgba(255,255,255,.22)}
.pvw{font-family:var(--display);font-size:12px;color:#c8d2ff;white-space:nowrap}
.ibtn.qb{font-family:var(--display);font-weight:700;font-size:20px;color:#ffe45c;line-height:1}
.guide{font-size:13px;line-height:1.5}.guide h3{font-family:var(--display);font-size:20px;color:#ffe45c;margin:0 0 10px}
.guide ul{margin:0 0 12px;padding-left:18px;display:grid;gap:7px}.guide p{margin:10px 0;color:var(--dim)}
.gt{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:12px}.gt th,.gt td{border:2px solid #080b1f;padding:5px 8px;text-align:left;vertical-align:middle}
.gt th{background:#1d2560;font-family:var(--display);color:#c8d2ff;white-space:nowrap}.gt td{background:rgba(29,37,96,.55)}.gt .amu{box-shadow:none}.gt.c td:not(:last-child){white-space:nowrap}.gt.c td{padding:3px 7px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:grid;gap:2px;text-align:left;padding:10px 12px;font-family:var(--display);font-size:20px;font-weight:700}
.tile span{font-family:var(--body);font-size:12px;font-weight:500;color:var(--dim)}
/* rarity: each tier sets --gl; the frame glow is drawn from it */
.r-ST{--gl:var(--st)}.r-C{--gl:var(--c)}.r-UC{--gl:var(--uc)}.r-R{--gl:var(--r)}.r-L{--gl:var(--l)}.r-SL{--gl:var(--sl)}.r-LT{--gl:#bff3ff}
.glow{--ln:color-mix(in srgb,var(--gl) 45%,#fff);box-shadow:0 0 0 2px var(--ln),0 0 7px 3px var(--gl),0 0 18px 6px color-mix(in srgb,var(--gl) 70%,transparent),0 0 34px 10px color-mix(in srgb,var(--gl) 30%,transparent)}
.r-C.glow{box-shadow:0 0 0 2px var(--c)}
/* Rare and above move: the halo breathes and stars twinkle on the frame */
.r-R.glow{animation:pulse 1.6s ease-in-out infinite alternate}
.r-L.glow{--gb:30px;--gs:10px;animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 2px var(--ln),0 0 5px 2px var(--gl),0 0 12px 4px color-mix(in srgb,var(--gl) 55%,transparent),0 0 22px 6px color-mix(in srgb,var(--gl) 20%,transparent)}
  to{box-shadow:0 0 0 2px var(--ln),0 0 10px 4px var(--gl),0 0 var(--gb,24px) var(--gs,8px) color-mix(in srgb,var(--gl) 80%,transparent),0 0 calc(var(--gb,24px)*1.8) calc(var(--gs,8px)*1.6) color-mix(in srgb,var(--gl) 38%,transparent)}}
.spr canvas.hf{position:absolute;z-index:auto;transform:none;filter:blur(1.2px) saturate(1.25);image-rendering:auto;pointer-events:none;top:auto;left:-22%;width:144%;bottom:0;height:104%;-webkit-mask:radial-gradient(ellipse 50% 100% at 50% 100%,#000 52%,rgba(0,0,0,.6) 74%,transparent 100%);mask:radial-gradient(ellipse 50% 100% at 50% 100%,#000 52%,rgba(0,0,0,.6) 74%,transparent 100%)}
.spr canvas.hf.k-LTs{height:122%;left:-28%;width:156%}
.spr canvas.hf.k-Ls{left:-14%;width:128%;top:-6%;bottom:auto;height:112%;opacity:1;image-rendering:pixelated;-webkit-mask:none;mask:none;filter:drop-shadow(0 0 2px rgba(255,200,0,.7))}
.spr>.sp{width:22%;z-index:auto}
.sp{position:absolute;z-index:3;width:17%;aspect-ratio:1;background:#fff;pointer-events:none;clip-path:polygon(50% 0,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0 50%,43% 43%);transform:translate(-50%,-50%) scale(0);animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,60%,100%{transform:translate(-50%,-50%) scale(0)}80%{transform:translate(-50%,-50%) scale(1)}}
/* fire frame: a pixel fire simulation drawn on a canvas that sits behind the card and overhangs every edge */
.fire{isolation:isolate}
.firec{position:absolute;z-index:-1;left:-17.5%;top:-13.7%;width:135%;height:127.4%;image-rendering:pixelated;pointer-events:none}
.fire.glow{animation:none;box-shadow:0 0 0 2px #ffec27,0 0 16px 5px rgba(255,90,0,.45)}
.fire.f-LT.glow{box-shadow:0 0 0 2px #bfeeff,0 0 28px 12px rgba(40,140,255,.6)}.fire.f-L.glow{box-shadow:0 0 0 2px #ffe27a,0 0 18px 6px rgba(255,190,30,.5)}
.firec.k-LT{transform:scale(.96,.95)}.firec.k-SLb{filter:drop-shadow(0 0 3px rgba(255,220,60,.9))}.firec.k-L{z-index:3;filter:drop-shadow(0 0 2px rgba(255,200,0,.7))}
/* rarity banner drawn over the caption strip of the card art */
.cnm{position:absolute;left:12.5%;right:12.5%;top:5.4%;height:7.4%;display:grid;place-items:center;background:none;color:#fff;font-family:var(--display);font-weight:700;font-size:6.4cqw;text-shadow:.5cqw .5cqw 0 #000;letter-spacing:.04em;line-height:1;white-space:nowrap;text-transform:uppercase;overflow:hidden}
.chp{position:absolute;top:16.6%;height:6.4%;min-width:22%;padding:0 2cqw;display:grid;place-items:center;background:rgba(8,10,24,.96);color:#fff;font-family:var(--display);font-weight:700;font-size:4.4cqw;line-height:1;white-space:nowrap}
.chp.l{left:10.5%}.ccl{position:absolute;left:10.5%;top:23.4%;height:6.8%;padding:0 2.2cqw;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:4.7cqw;line-height:1;white-space:nowrap;border-radius:0 0 1.6cqw 0;text-shadow:0 .3cqw 0 rgba(0,0,0,.55)}.clsbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;position:sticky;top:0;z-index:5;padding:6px 0;background:linear-gradient(rgba(10,14,34,.96) 80%,transparent)}.clsb{font:inherit;font-family:var(--display);font-weight:700;font-size:14px;color:#dfe5ff;background:rgba(20,28,70,.92);border:2px solid #3a4690;border-radius:999px;padding:5px 13px;cursor:pointer;white-space:nowrap}.clsb.on{color:#fff;border-color:#ffd84a;background:var(--k,#33407f)}.chp.r{right:10.5%;color:#ffd98a}
.ban{position:absolute;left:10%;right:10%;top:64%;height:6.4%;display:grid;place-items:center;background:none;text-shadow:.4cqw .4cqw 0 #000;color:var(--gl);font-family:var(--display);font-weight:700;font-size:5.2cqw;letter-spacing:.08em;line-height:1;white-space:nowrap}
.pan{position:absolute;left:9.6%;right:9.6%;top:75.4%;height:14.6%;display:grid;grid-template-columns:28.4cqw 1fr 28.4cqw;align-items:center;justify-items:center;gap:0;padding:0;
  background:linear-gradient(#3a2a5c,#1a1230);box-shadow:inset 0 0 0 .8cqw #0a0e22,inset 0 0 0 1.5cqw #d9a441;font-family:var(--display);font-weight:700;line-height:1}
.sb{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:center;gap:.2cqw 1cqw;padding:0;background:none;min-width:0;width:100%}
.sb.a{--sc:#ff7a4d}.sb.m{--sc:#c98bff}.sb.d{--sc:#5cb8ff}.sb2{display:grid;gap:.8cqw;width:100%;min-width:0}.sb2 span{display:flex;justify-content:center;align-items:baseline;gap:1.2cqw;white-space:nowrap}.sb2 b{font-size:4.2cqw;letter-spacing:.04em}.sb2 .h b{color:#ff6b7d}.sb2 .f b{color:#5cb8ff}.sb2 i{font-style:normal;font-size:6.6cqw;line-height:1;color:#fff;font-variant-numeric:tabular-nums;text-shadow:.5cqw .5cqw 0 #000}
.sb img{width:5.6cqw;height:5.6cqw;max-width:none;image-rendering:pixelated}
.sb img{width:4.6cqw!important;height:4.6cqw!important}.sb b{font-size:4.6cqw;letter-spacing:.06em;color:var(--sc);text-align:left;white-space:nowrap}
.sb i{grid-column:1/-1;font-style:normal;font-size:8.6cqw;line-height:1;color:#fff;text-align:center;font-variant-numeric:tabular-nums;text-shadow:.6cqw .6cqw 0 #000}
.amslot{display:grid;place-items:center;width:12cqw;height:12cqw;border-radius:50%;border:.6cqw dashed rgba(217,164,65,.6);color:#d9a441;font-size:8cqw;line-height:1}
.amslot.has{border:0}
/* amulets: a round charm in the amulet's colour */
.amu{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 35%,#4a59a8,#161c44 75%);box-shadow:inset 0 0 0 2px var(--k1),0 0 0 2px #0a0e22,0 0 0 4px #d9a441,0 0 0 6px #0a0e22}
.amslot .amu{width:11cqw;height:11cqw;aspect-ratio:auto;box-shadow:inset 0 0 0 .5cqw var(--k1),0 0 0 .6cqw #0a0e22,0 0 0 1.3cqw #d9a441}
.amu img{width:94%;image-rendering:auto}
.amu.ar-L{box-shadow:inset 0 0 0 2px var(--k1),0 0 0 2px #0a0e22,0 0 0 4px #ffd23a,0 0 0 6px #0a0e22,0 0 10px 4px rgba(255,210,58,.75)}.amu.ar-R{box-shadow:inset 0 0 0 2px var(--k1),0 0 0 2px #0a0e22,0 0 0 4px #4aa8ff,0 0 0 6px #0a0e22}
.amslot .amu.ar-L{box-shadow:inset 0 0 0 .5cqw var(--k1),0 0 0 .6cqw #0a0e22,0 0 0 1.3cqw #ffd23a,0 0 2cqw 1cqw rgba(255,210,58,.7)}.amslot .amu.ar-R{box-shadow:inset 0 0 0 .5cqw var(--k1),0 0 0 .6cqw #0a0e22,0 0 0 1.3cqw #4aa8ff}
.art-L{color:#ffd23a}.art-R{color:#6cbcff}
#fsb{position:absolute;inset:0;z-index:12;display:grid;place-items:center;background:rgba(4,8,24,.55)}#fsb[hidden]{display:none}.fsbox{display:grid;gap:10px;width:min(780px,95%);max-height:90%;overflow:auto;padding:16px 18px;text-align:center;font-size:14px;line-height:1.45}.fsbox p{margin:0}.fsbox .row{justify-content:center}.fsbox .row .btn{min-width:150px}
.fshd{position:relative;display:grid;gap:7px}.fsx{position:absolute;right:-6px;top:-4px;width:34px;height:34px;font:700 17px/1 var(--body);color:#fff;background:#a8322a;border:2px solid #000;box-shadow:inset 0 0 0 2px #ff8a7a;cursor:pointer}.fshd>b{font-family:var(--display);font-size:21px;color:#ffe45c;text-shadow:2px 2px 0 #000}.fsst{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}.fsst span{padding:2px 9px;font-size:12.5px;font-weight:700;background:#0c1426;border:2px solid #3b4a7a;color:#d6dcea}.fsst .w{border-color:#3fbf63;color:#8dffaa}.fsst .l{border-color:#c0473c;color:#ffaaa0}.fsst .u{border-color:#5aa8ff;color:#a9d6ff}
.fsg{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 14px;overflow:hidden;background:linear-gradient(180deg,#5a3d06,#2a1c04);border:3px solid #ffd23a;box-shadow:inset 0 0 0 2px #000,0 0 18px rgba(255,210,58,.35)}.fsg::before{content:'';position:absolute;inset:-60% -10%;background:linear-gradient(105deg,transparent 40%,rgba(255,246,192,.28) 50%,transparent 60%);animation:fsshine 3.2s linear infinite;pointer-events:none}@keyframes fsshine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.fsc{display:grid;place-items:center;width:58px;height:58px;flex:none;animation:bobi 2.6s ease-in-out infinite}.fsc img{width:100%;filter:drop-shadow(0 0 8px rgba(255,210,58,.8))}.fsg>div{display:grid;text-align:left;line-height:1.15}.fsbox .fsg small{font-size:12px;color:#ffe9a8;letter-spacing:.5px}.fsg b{font-family:var(--display);font-size:34px;color:#ffe45c;text-shadow:3px 3px 0 #000,0 0 12px rgba(255,210,58,.7)}.fsbox .fsg i{font-style:normal;font-size:12.5px;color:#f5deb0}.fsv{position:absolute;right:8px;top:6px;padding:1px 7px;font-size:11px;font-weight:700;background:#ffd84a;color:#111}

// dmo/{id} = an order {u,nm,s:'a' sells diamonds|'b' buys diamonds,p Gold per diamond,q diamonds left,t seller tax %,at}. The maker's diamonds (sell) or Gold (buy) leave the save when it is posted.

// Each fill also writes the trade log dmt/ and the day's candle doc dmc/{yyyymmdd} = {d, c:{slot:[o,h,l,c,v]}} (96 slots of 15 min, Bangkok time) that the chart reads.
// Every diamond can be sold (owner's call, b176). The shop still sells diamonds for 2,000 Gold each without limit, so the market lives between DM.min and DM.max;
// the floor stops the market being used to hand diamonds over for a token price (real-money deals outside the game). The daily limits cap what one account can move.

let dm={st:'idle',at:0,book:[],mine:[],tr:[],days:{},tf:'1h',side:'b',q:10,p:0,msg:'',busy:false,ref:DM.start,last:DM.start,cs:null};

    const t=t0+Math.floor(s/per)*per*9e5,L=out[out.length-1];if(L&&L.t===t){L.h=Math.max(L.h,v[1]);L.l=Math.min(L.l,v[2]);L.c=v[3];L.v+=v[4]}else out.push({t,o:v[0],h:v[1],l:v[2],c:v[3],v:v[4]})})});

/* ---------- players online ----------
   Every signed-in player writes online/{uid} = {at: server time} every 10 minutes while the game is on screen, and asks the database how many
   such notes are newer than 15 minutes. That is 1 write + about 1 read per player per 10 minutes. Shown in the lobby under the logo. */
const ON_BEAT=10*60e3;let onl={n:0,at:0,beat:0};
function onlineTick(){if(!mkOn()||document.hidden||Date.now()-onl.beat<ON_BEAT-5000)return;onl.beat=Date.now();
  fbLoad().then(fbUser).then(u=>{if(!u)return;const col=firebase.firestore().collection('online'),q=()=>col.where('at','>',new Date(Date.now()-ON_BEAT*1.5));
    return col.doc(USER.sub).set({at:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>typeof q().count==='function'?q().count().get().then(r=>r.data().count):q().get().then(r=>r.size))
     .then(n=>{onl.n=Math.max(1,n|0);onl.at=Date.now();onlShow()})}).catch(()=>{onl.beat=Date.now()-ON_BEAT+60e3})}
function onlShow(){const e=$('onlw');if(!e)return;const ok=onl.at&&Date.now()-onl.at<ON_BEAT*2.5;e.hidden=!ok;if(ok)$('onl').textContent=onl.n.toLocaleString('en')}
setInterval(onlineTick,60e3);document.addEventListener('visibilitychange',()=>{if(!document.hidden)onlineTick()});

/* week roll: tower progress and PvP stars */
function twGet(){const w=twWeek();if(S.tw&&(S.tw.w>=w||(mkOn()&&!tSync)))return S.tw;if(S.tw&&S.tw.f>0&&S.tw.w>(S.twd||0)){S.twp=S.twp||[];if(!S.twp.some(p=>p.w===S.tw.w))S.twp.push({w:S.tw.w,f:S.tw.f})}S.tw={w,f:0};save();return S.tw}
// PvP season = the same week. At its end: best rank of the season becomes a collectible shield (mailed with arena coins), stars are halved, the season's win/loss record starts over.
function pvRoll(){const me=pvGet(),w=twWeek();if(me.sw==null){me.sw=w;return}if(me.sw>=w)return;
  if(me.w+me.l>0){const i=rankOf(Math.max(me.hi||0,me.st)).i;mailAdd({id:'pv'+me.sw,k:'pv',w:me.sw,r:i,it:{sh:'P'+i+'.'+twSeason(me.sw),ac:PV_END_AC[i]}})}
  me.st=Math.floor(me.st/2);me.hi=me.st;me.w=0;me.l=0;me.ws=0;me.bs=0;me.sw=w;save();pvpPush()}

/* a tower fight and the run between floors */
async function startTower(f,cont){const t=twGet();bt={n:twEq(f),tw:f,w:t.w,round:1,sel:0,log:'',pvp:null,farm:false,first:true,in:1,al:S.team.map(id=>fighter(id,S.cards[id].lv)),en:twDef(f)};c3Amu(bt);plBuff(bt);
  const my=bt,boss=f%10===0;busy=true;draw();my.in=0;if(boss){sfx('ult');ov(`<div class="bn lose twbn"><span>⚠ BOSS</span></div>`);await W(RM?500:900);ov('');if(bt!==my)return}
  if(!cont){sfx('start');await banner(T('ชั้น ','FLOOR ')+f);if(bt!==my)return}else{await W(RM?150:380);if(bt!==my)return}
  const bs=my.en.find(e=>e.boss&&e.gim);busy=false;my.log=bs?gimT(bs.id).replace(/<[^>]+>/g,''):T('เลือกสกิล แล้วแตะศัตรู','Pick a skill, then tap an enemy');draw();if(S.auto)autoAct()}
function twEnter(){const t=twGet();S.team=S.team.filter(id=>S.cards[id]);if(!S.team.length||!(isDev()||(S.cleared||0)>=TW_OPEN))return tower();loop=0;twRun={from:t.f+1,g:0,x:0,n:0,got:[]};save();startTower(t.f+1)}
function twLeave(){bt=null;busy=false;ov('');twTok++;twPush(1);twTab='board';tower()}
async function twFinish(won){const my=bt,f=my.tw,team=my.al.map(a=>a.id);busy=true;
  if(!won){sfx('lose');await banner('DEFEAT','lose');if(bt!==my)return;bt=null;busy=false;twPush(1);return twResult(f)}
  const t=twGet();if(t.w!==my.w||f!==t.f+1){bt=null;busy=false;fx.push(['view',T('สัปดาห์ใหม่เริ่มแล้ว','A new week has begun'),'g']);return tower()}   // the week turned over (or the save moved on) during the fight: this floor no longer counts
  sfx('win');const s=my.n,g=twGold(f)*VX(),bb=twBossG(f),x0=twXp(f)*VX(),got=[];S.gold+=g+bb;lg('tower',g);lg('twboss',bb);qAdd('win');if(f%10===0)qAdd('boss');
  const dp=(b,bs)=>Math.min(1,(f%10===0?bs:b)*dropMul(s,true)*vipP().dr*TW_DROP);
  if(Math.random()<dp(DROP,DROP_BOSS)){const k=amRoll();S.am=S.am||{};S.am[k]=(S.am[k]||0)+1;got.push(['m',k])}
  if(Math.random()<dp(CDROP,CDROP_BOSS)){const c=giveCard(randOf(cardDropRank(s)),'tower');got.push(['c',c.id,c.dup?1:0])}
  let ups=0;team.forEach(id=>{if(S.cards[id])ups+=addExp(id,Math.round(x0*(amOf(id)&&amOf(id).xp||1)))});
  if(TW_MS[f])itGive(TW_MS[f],'twms').forEach(o=>got.push(o));
  if(f>(t.f||0)&&f%10===0)plGain('tower');t.f=f;t.at=Date.now();if(twRun){twRun.g+=g+bb;twRun.x+=x0;twRun.n++;got.forEach(o=>{if(o[0]!=='g')twRun.got.push(o)})}save();twPush(f%10===0);if(f%10===0)cloudFlush();
  bt=null;busy=false;return twAdvance(f,{g,bb,x0,ups,got,team})}

     T(`แต่ละใบมี 3 สกิล: สกิล 1 ใช้ได้ทุกตา สกิล 2 ใช้ได้ตั้งแต่ตาแรกแล้วพัก ${CD[1]} ตา สกิล 3 ใช้ได้ตั้งแต่ตาที่ ${ULT_CD0+1} แล้วพัก ${CD[2]} ตา`,`Each card has 3 skills: skill 1 every turn, skill 2 is ready from the first turn and then rests ${CD[1]} turns, skill 3 is ready from turn ${ULT_CD0+1} and then rests ${CD[2]} turns`)+'</li><li>'+T(`ทุกสกิลมีผลทันที: สกิลบัฟ ${pc(SK_HIT.buff)} / บัฟทีม ${pc(SK_HIT.rally)} / ยั่วและโล่ ${pc(SK_HIT.guard)} โจมตีศัตรูในตาเดียวกันด้วย · สกิลตีหมู่ใส่ศัตรูที่เหลือตัวเดียวแรง ${AOE_LONE} เท่า · ฮีลส่วนที่เกิน HP เต็มกลายเป็นโล่ · โหมดออโต้เลือกสกิลตามสถานการณ์ (ตีหมู่เมื่อศัตรู 2 ตัวขึ้นไป ฮีลเมื่อเพื่อนเลือดต่ำ ยั่วเมื่อยังไม่มีใครยั่ว)`,`Every skill acts at once: buffs ${pc(SK_HIT.buff)} / team buffs ${pc(SK_HIT.rally)} / taunts and guards ${pc(SK_HIT.guard)} also strike a foe in the same turn · an area attack on a lone foe hits ${AOE_LONE}x · healing past full HP becomes a shield · Auto picks skills by the situation (area attacks on 2+ foes, heals when an ally is low, a taunt when nobody is taunting)`),
     T('<b>CRIT</b>: แต่ละใบมีโอกาสคริของตัวเอง ดาเมจคริ x1.5 (Shadow Ninja x1.75) · ศัตรูมีโอกาสคริครึ่งหนึ่งของการ์ดใบนั้น','<b>CRIT</b>: each card has its own crit chance; crit damage is x1.5 (Shadow Ninja x1.75) · enemies crit half as often as the card they copy'),
     T('<b>สายของการ์ด</b>: การ์ดทุกใบมีป้ายสายที่มุมบนของภาพ · ⚔ กายภาพ (โจมตีด้วย ATK) · ✦ เมจ (โจมตีด้วย MATK) · 🛡 แท้งค์ (ตั้งโล่ ล่อศัตรู) · ✚ ซัพพอร์ต (ฮีล สร้างโล่ให้ทีม) · หน้า กระเป๋าไอเท็ม › การ์ด มีแถบด้านบนให้กดดูทีละสาย','<b>Card classes</b>: every card carries a class badge at the top of its picture · ⚔ Physical (attacks with ATK) · ✦ Mage (attacks with MATK) · 🛡 Tank (shields up, taunts) · ✚ Support (heals and shields the team) · Bag › Cards has a bar at the top to filter by class'),
     T('<b>เกราะ 2 ชนิด</b>: ศัตรูเกราะหนัก (Tar Ooze, Clockwork Scarab, Citadel Crab, Magma Colossus) รับดาเมจกายภาพลดลงแต่<b>แพ้เวท</b> · ศัตรูสายเวท (Sporecap Stalker, Storm Jelly, Wraith Lantern, Obsidian Dragon) รับดาเมจเวทลดลงแต่<b>แพ้กายภาพ</b> · เริ่มมีผลหลังด่าน 30 และเต็มที่ตั้งแต่ด่าน 60 · หน้าเตรียมด่านและป้ายเหนือหัวศัตรูบอกจุดอ่อน · เลขดาเมจมี ▲ เมื่อตีโดนจุดอ่อน และ ▼ เมื่อโดนเกราะ · การ์ดแท้งค์รับกายภาพ −15% เวท +20% · การ์ดเมจสายโจมตีรับเวท −20% กายภาพ +10%','<b>Two kinds of armour</b>: plated enemies (Tar Ooze, Clockwork Scarab, Citadel Crab, Magma Colossus) take less physical damage but are <b>weak to magic</b> · spirit and caster enemies (Sporecap Stalker, Storm Jelly, Wraith Lantern, Obsidian Dragon) take less magic damage but are <b>weak to physical</b> · this starts after stage 30 and is at full strength from stage 60 · the stage screen and the tag over each enemy show the weakness · a damage number carries ▲ on a weak spot and ▼ against armour · tank cards take −15% physical and +20% magic · attacking mage cards take −20% magic and +10% physical'),
     T('<b>ด่านไม่ล็อกตาย</b>: ด่านที่ยังไม่เคยผ่าน ความแรงของศัตรูแต่ละรอบไม่เท่ากันเล็กน้อย และทุกครั้งที่แพ้ ศัตรูในด่านนั้นจะเหนื่อยล้าลงทีละนิด (มีเพดาน) จนกว่าจะชนะ · ด่านที่ผ่านแล้วและโหมดเล่นซ้ำความยากคงที่','<b>No hard walls</b>: on a stage you have not cleared, enemy strength varies a little from try to try, and each loss wears that stage\'s enemies down a bit more (up to a limit) until you win · cleared stages and the replay loop stay fixed'),
     T('<b>โล่</b>: รับดาเมจแทนเลือดก่อน สะสมได้ไม่เกิน HP สูงสุดของตัวนั้น','<b>Shield</b>: absorbs damage before life, up to that fighter\'s max HP'),
     T('<b>ล่อศัตรู (Taunt)</b>: สกิลโล่ของแท้งค์ทำให้ศัตรูตีตัวเอง 2 รอบ และรับดาเมจลดลง 40%','<b>Taunt</b>: a tank\'s guard skill makes enemies hit it for 2 rounds, and it takes 40% less damage'),
     T('<b>บัพโจมตี</b>: เพิ่มพลังโจมตีจนจบด่าน ซ้อนได้ไม่เกิน 2 เท่าของค่าเริ่มต้น','<b>Attack buffs</b> last the whole stage and stack up to 2x the starting value'),
     T('<b>Aurum Hydra (Limited)</b> มีพลังติดตัว Golden Hunger: ทุกการโจมตีฟื้น HP ตัวเอง 20% ของดาเมจ · การ์ดระดับ Limited โตเลเวลละ 10.5% (สูงกว่า Super Legend)','<b>Aurum Hydra (Limited)</b> has the passive Golden Hunger: every attack restores 20% of its damage as HP · Limited cards grow 10.5% per level (above Super Legend)'),
     T('<b>ฮีล</b>คิดจากพลังโจมตีของผู้ใช้ · <b>ดูดเลือด</b>ฟื้นครึ่งหนึ่งของดาเมจ · <b>ปลิดชีพ</b>แรง 2 เท่าถ้าเป้าหมายเลือดไม่ถึงครึ่ง','<b>Heals</b> scale with the caster\'s attack · <b>drain</b> restores half the damage dealt · <b>execute</b> hits twice as hard below half life'),
     T('เลขเด้ง: <b style="color:#ff5a4a">แดงเล็ก</b> ดาเมจกายภาพ · <b style="color:#ff2a1a">แดงใหญ่!</b> คริ · <b style="color:#6fd0ff">ฟ้าเล็ก</b> ดาเมจเวท · <b style="color:#5a8cff">น้ำเงินใหญ่!</b> คริเวท · <b style="color:#5dff7a">เขียว</b> ฮีล · <b style="color:#bfeaff">ฟ้าอ่อน</b> โล่','Numbers: <b style="color:#ff5a4a">small red</b> physical · <b style="color:#ff2a1a">big red!</b> crit · <b style="color:#6fd0ff">small blue</b> magic · <b style="color:#5a8cff">big blue!</b> magic crit · <b style="color:#5dff7a">green</b> heal · <b style="color:#bfeaff">pale blue</b> shield'),
     T('ปุ่มออโต้ให้เกมเล่นเอง · ปุ่ม x1/x2 ปรับความเร็ว · ปุ่มถอยออกจากด่านโดยไม่เสียอะไร','Auto plays for you · x1/x2 changes speed · Retreat leaves the stage at no cost'),
     T('<b>ตั้งสกิลออโต้เอง</b>: กดเข้าสู้แล้วหน้าตั้งสกิลเด้งขึ้นมา (ดูสเตตัสและสกิลทุกใบในทีม) → <b>อัจฉริยะ</b> (ค่าเริ่มต้น ออโต้เลือกตามสถานการณ์) หรือ <b>กำหนดเอง</b> (เรียงลำดับด้วย ▲▼ และกดเปิด/ปิดแต่ละสกิล ออโต้ใช้สกิลแรกในลำดับที่ไม่ติดพัก ถ้าไม่มีจะตีปกติ) · มีปุ่มรีเซ็ตกลับเป็นอัจฉริยะ · ใช้กับการ์ดของเราทุกโหมด','<b>Custom auto skills</b>: press Fight and the setup panel pops up (every team card\'s stats and skills) → <b>Smart</b> (default, auto picks for the moment) or <b>Custom</b> (order with ▲▼ and switch each skill on/off; auto uses the first skill in the order that is not cooling down, otherwise a normal attack) · a reset-to-smart button is always there · works for your cards in every mode'),
     T(`<b>แพ้แล้วเล่นต่อ (VIP)</b>: สวิตช์ใต้ปุ่มวนด่านและในแถบด่าน · วนด่านแล้วแพ้ ระบบเล่นต่อให้เอง (โหมดเล่นซ้ำ: ด่านเดิม · โหมดเปลี่ยนด่านอัตโนมัติ: ถอยกลับไปวนด่านล่าสุดที่ชนะ) หยุดเองเมื่อแพ้ติดกัน ${LP_RETRY} ครั้ง`,`<b>Retry on defeat (VIP)</b>: a switch under the loop buttons and on the battle bar · a loss while looping no longer ends it (replay mode: same stage · auto-next mode: falls back to replaying the last stage won) and it stops after ${LP_RETRY} losses in a row`)])],

      T('<b>เครื่องราง SuperLegend</b> ได้จากฟิวชั่นเท่านั้น ไม่ดรอปจากด่าน ไม่อยู่ในแพ็คหรือรางวัลใดๆ · <b>ใส่ได้เฉพาะการ์ดระดับ Super Legend และ Limited</b> · ขายในตลาดกลางและเทรดได้','<b>SuperLegend amulets</b> come from fusion only: they never drop and are in no pack or reward · <b>only Super Legend and Limited cards can wear them</b> · they can be sold on the market and traded'),

   trade:[T('ตลาดและห้องเทรด','Market and trade rooms'),()=>ul([
     T('ต้องล็อกอินด้วย Google ถึงจะใช้ตลาดกลางและเห็นผู้เล่นอื่นในห้องเทรด','Sign in with Google to use the market and to see other players in trade rooms'),T('ห้องเทรดส่งต่อได้เฉพาะเครื่องรางระดับ Legend / SuperLegend และการ์ดระดับ Super Legend / Limited เท่านั้น · การ์ดจะส่งใบซ้ำก่อน ถ้าไม่มีใบซ้ำจะส่งการ์ดตัวจริง (เลเวล ดาว Exp หาย ผู้รับได้เลเวล 1) · การ์ดอีเวนต์เทรดไม่ได้','Trade rooms can pass on only Legend / SuperLegend amulets and Super Legend / Limited cards · a duplicate copy goes first; with no copy the card itself is sent (its level, stars and Exp are lost, the receiver gets level 1) · event cards cannot be traded'),
     T('<b>ศัตรูในด่าน</b>เป็นมอนสเตอร์ทั้งหมด (มอนเล็ก 10 ชนิด บอส 5 ตัวสลับกันทุกด่านที่ลงท้ายด้วย 0) · การ์ดของผู้เล่นจะเจอเป็นคู่ต่อสู้เฉพาะใน PvP · มีแผนที่ 10 แห่ง สลับบรรยากาศ 23 แบบ · ท่าโจมตีและสกิลมีเอฟเฟกต์ภาพวาดตามชนิดสกิล','<b>Stage enemies</b> are all monsters (10 small kinds, 5 bosses taking turns on every stage ending in 0) · player cards are met as opponents only in PvP · there are 10 maps in 23 moods · attacks and skills show painted effects by skill type'),
     T('<b>ของขวัญจากทีมงาน</b>: บางช่วงทีมงานแจก VIP ให้ทุกคนที่ล็อกอินด้วย Google แล้วเข้าล็อบบี้ในช่วงเวลาที่ประกาศ รับได้ 1 ครั้งต่อรอบ มีป๊อปอัปแจ้งตอนได้รับ','<b>Gifts from the team</b>: now and then the team gives VIP to everyone who signs in with Google and opens the lobby during the announced period, once per gift, with a pop-up when it arrives'),
     T('<b>ประวัติตลาด</b>: ปุ่ม "ประวัติ" ข้างปุ่มซื้อ/ขาย ในหน้าตลาดกลาง แสดง 40 รายการล่าสุดที่ซื้อขายกันทั้งตลาด ว่าใครขายอะไรให้ใคร ราคาเท่าไร เมื่อไร · แยกแท็บเครื่องราง/การ์ด กรองระดับและชื่อได้ · รายการของคุณมีป้าย (คุณซื้อ)/(คุณขาย) · บันทึกเริ่มตั้งแต่บิลด์ b175','<b>Market history</b>: the "History" button next to Buy/Sell on the market shows the last 40 trades across the whole market: who sold what to whom, the price and when · split by the amulet/card tabs, with rank and name filters · your own trades are tagged (you bought)/(you sold) · recorded from build b175 on'),

     T(`<b>ตลาดกลาง</b>: ลงขายเครื่องรางที่ไม่ได้ใส่ และการ์ดทุกใบ (ยกเว้นการ์ดเริ่มต้น) มีใบซ้ำจะขายใบซ้ำก่อน ไม่มีใบซ้ำจะขายการ์ดตัวจริง ยกเว้นการ์ดที่อยู่ในทีม ทีม PvP หรือเป็นตัวละคร · ล็อคการ์ดได้ในหน้ารายละเอียดการ์ด ล็อคเครื่องรางได้ในหน้าเครื่องราง ของที่ล็อคจะขาย เทรด และย่อยไม่ได้ · ตั้งราคาเอง 100–${N(MK_MAX)} Gold · ค่าวางขาย ${P(MK_FEE)} ของราคา ขั้นต่ำ 50 Gold จ่ายตอนลงขายและไม่คืน · ผู้ขายถูกหักภาษี ${P(TAX)} เมื่อขายได้`,`<b>Market</b>: list unequipped amulets and any card except starters. A duplicate copy is sold first; with no copy the card itself is sold, unless it is in your team, PvP team or used as your avatar · lock a card on its detail screen and an amulet on the Amulets screen; locked items cannot be sold, traded or dismantled · set your own price, 100–${N(MK_MAX)} Gold · listing fee ${P(MK_FEE)} of the price, at least 50 Gold, paid up front and not refunded · the seller pays ${P(TAX)} tax when it sells`),
     T(`<b>ห้องเทรด</b>: มี ${ROOMS} ห้อง ห้องละ ${ROOM_CAP} คน ใช้จอยสติกเดิน พิมพ์แชทได้ ข้อความลอยเหนือหัว`,`<b>Trade rooms</b>: ${ROOMS} rooms of ${ROOM_CAP} players; use the joystick to walk; chat appears over your head`),
     T(`การเทรดคือการ<b>ให้ของ</b>ทางเดียว: แตะผู้เล่นอื่น เลือกของที่จะส่ง ผู้ส่งจ่ายค่าธรรมเนียม ${N(TRADE_TAX)} Gold และผู้รับต้องกดยืนยัน`,`A trade is a one-way <b>gift</b>: tap a player, pick an amulet; the sender pays a ${N(TRADE_TAX)} Gold fee and the receiver must confirm`),
     T('ถ้าผู้รับปฏิเสธหรือออกจากห้อง ของและค่าธรรมเนียมจะคืนให้ผู้ส่ง','If the receiver declines or leaves, the item and fee return to the sender'),
     T('ตัวละครที่เดินในห้องคือการ์ดที่เรามี เปลี่ยนได้ที่รูปโปรไฟล์ เอฟเฟกต์รอบตัวบอกระดับการ์ด','Your avatar is one of your own cards (change it from your profile); its effect shows the card\'s rank'),
     T('เกมไม่มีระบบซื้อขายด้วยเงินจริงระหว่างผู้เล่น','The game has no real-money trading between players')])],

     T('ซื้อซ้ำเป็นการต่ออายุ ระดับสิทธิ์ใช้ของบัตรสูงสุดที่ซื้อไว้ตราบที่ VIP ไม่ขาดช่วง · เพชรรายวันเข้าเองเมื่อเปิดล็อบบี้ วันละครั้ง · บัตร VIP จากร้านอารีน่าเป็นระดับ Bronze · Gold จากภารกิจและโบนัสบอสไม่คูณ','Buying again adds days; you keep the perks of the highest card bought while VIP does not lapse · daily diamonds arrive when you open the lobby, once a day · the arena-shop VIP card is Bronze · quest and boss-bonus Gold are not doubled'),

   pvp:['PvP',()=>ul([
     T(`การจับคู่: หาคู่ที่ดาวห่างกันไม่เกิน ${MM_STEP} ดาวก่อน (ราว 1 ขั้น) ถ้าคนไม่พอจะขยายทีละ ${MM_STEP} ดาว แต่ไม่เกิน ${MM_MAX} ดาว (ราว 1 ระดับแร้งค์) ถ้ายังไม่พอจะเจอบอทที่แร้งค์เดียวกับเราแทน จะไม่จับคู่ข้ามแร้งค์ไกลกว่านี้ · คนที่เพิ่งสู้ไป 3 คนล่าสุดจะถูกข้ามถ้ามีคนอื่นให้เลือก`,`Matchmaking: opponents within ${MM_STEP} stars first (about one division); if too few, the band widens by ${MM_STEP} stars at a time up to ${MM_MAX} stars (about one tier); beyond that you meet bots at your own rank instead, never a far higher or lower rank · the last 3 players you fought are skipped when others are available`),T('สู้กับทีมของผู้เล่นคนอื่นที่บันทึกไว้ ทีมฝั่งตรงข้ามเล่นเองอัตโนมัติและใช้สกิลครบเหมือนเรา','Fight another player\'s saved team. It plays itself and uses its full skills'),
     T('ก่อนสู้จะไม่เห็นการ์ดของฝ่ายตรงข้าม เห็นแค่ชื่อและระดับ กดท้าสู้แล้วเลือกการ์ดของเรา 3 ใบ เลือกออโต้หรือกดสกิลเอง แล้วกดเริ่ม มีนับถอยหลัง 3 วินาที','You cannot see the opponent\'s cards beforehand, only the name and rank. Tap Fight, pick your 3 cards, choose auto or manual, then Start; a 3-second countdown follows'),

   <h2 style="font-size:24px">ยินดีต้อนรับ</h2><p>${S.wiped?`<span class="nt">${T('CBT จบแล้ว ข้อมูลทั้งหมดถูกล้างเพื่อเริ่มใหม่พร้อมกัน','The CBT has ended. All progress was reset so everyone starts together')}${Object.keys(S.wiped.lt||{}).length?' · <b style="color:#6fd8ff">'+T('การ์ด Limited ของคุณยังอยู่: ','Your Limited cards were kept: ')+Object.keys(S.wiped.lt).filter(id=>C[id]).map(id=>C[id].n+(S.wiped.lt[id]>1?' ×'+S.wiped.lt[id]:'')).join(', ')+'</b>':''}</span><br>`:''}${S.mig!=null?'อัปเดตใหญ่: ตัวละครชุดใหม่ทั้งหมด เริ่มด่าน 1 ใหม่ · Gold เพชร และเครื่องรางยังอยู่ครบ'+(S.mig?` · <b class="nt gold">+${S.mig.toLocaleString('en')} Gold</b> ชดเชยการ์ดชุดเก่า`:'')+'<br>':''}ของขวัญล็อกอิน: การ์ดเริ่มต้น 3 ใบ</p>
   <div class="gift">${GIFT.map(id=>`<div>${full(id,'','glow').replace('<button','<span').replace('</button>','</span>')}</div>`).join('')}</div>
   <button class="btn go" data-act="claim">รับการ์ด</button></div>`)}
const TIPS=['การ์ดได้ Exp เฉพาะใบที่อยู่ในทีมตอนชนะ','ด่านบอสทุก 10 ด่าน ดรอป Gold ทุกครั้ง และมีโอกาสได้เครื่องรางสูงกว่า','การ์ดแต่ละระดับมีเลเวลสูงสุดไม่เท่ากัน','ดู Lv แนะนำในหน้าเลือกด่านก่อนเข้าสู้','การเทรดคือการให้ของ ต้องยืนยันว่าเป็นผู้ส่งหรือผู้รับทุกครั้ง'];
// loading screen: really preloads every card, fighter and the next map so nothing pops in during play
function loading(wait){
  const next=Math.min(MAXST,S.cleared+1),list=[COVER_BG,mapImg(next),...Object.keys(FXS).concat(Object.keys(PJS)).map(k=>`fx/${k}.webp`),...stageDef(next).filter(e=>C[e.id].mon).flatMap(e=>[sprUrl(e.id),artSrc(e.id)]),
    // b208: only the player's own cards are fetched up front (the 16-frame sheets are big); every other picture loads when it is first shown
    ...[...new Set([...Object.keys(S.cards||{}),...(S.team||[]),S.me&&S.me.look].filter(id=>id&&C[id]))].flatMap(id=>[img(id),sprUrl(id)])];
  view(`<div class="loadv art" style="--bg:url(${COVER_BG})"><div class="cbg"></div>
   <div class="lbar"><i id="lbi"></i></div><p class="lpct nt" id="lpc">0%</p>
   <p class="ltip">${TIPS[Math.floor(Math.random()*TIPS.length)]}</p></div>`);
  let done=0,fin=false;const t0=performance.now(),total=list.length;
  const go=()=>{if(!$('lbi'))return;if(!USER)return titleScreen();S.gift?home():welcome()};
  const end=()=>{if(fin)return;fin=true;const w=Promise.race([Promise.resolve(wait).catch(()=>{}),new Promise(r=>setTimeout(r,9000))]);w.then(()=>setTimeout(go,Math.max(250,1400-(performance.now()-t0))))};
  const tick=()=>{done++;const b=$('lbi'),p=$('lpc'),v=Math.round(done/total*100);if(b)b.style.width=v+'%';if(p)p.textContent=v+'%';if(done>=total)end()};
  let k=0;const pump=()=>{if(k>=total)return;const im=new Image();im.onload=im.onerror=()=>{tick();pump()};im.src=list[k++]};
  for(let i=0;i<6;i++)pump();setTimeout(()=>{const b=$('lbi');if(b)b.style.width='100%';end()},12000);
}
// UI size: the stage is laid out smaller or larger than the screen and scaled back to fill it, so every screen grows or shrinks together (kept per device)
const uiK=()=>{let k=1;try{k=+localStorage.getItem('pdb_ui')||1}catch(e){}return Math.max(.8,Math.min(1.3,k))};
function fit(){const w=innerWidth,h=innerHeight,p=h>w&&!isPC(),s=$('stage'),k=uiK();s.style.width=(p?h:w)/k+'px';s.style.height=(p?w:h)/k+'px';s.style.setProperty('--H',(p?w:h)/k+'px');s.style.transform=(p?`rotate(90deg) translateY(${-w}px) `:'')+(k===1?'':`scale(${k})`)||'none'}
fit();addEventListener('resize',fit);
// real landscape: go fullscreen and lock the device to landscape so the phone's own keyboard comes up sideways too (Android browsers; elsewhere it fails quietly and the upright text box below is used)
// b182: on a computer (mouse, no touch) the game starts windowed and never forces fullscreen on a click; the settings switch still turns it on,
// and leaving fullscreen there (Esc) switches it back off, so players can keep the game in a small window
// b188: a computer = not a phone or tablet by its browser, so touch-screen laptops count as computers too
function isPC(){try{const u=navigator.userAgent||'';if(/Android|iPhone|iPad|iPod|Mobile|Silk|Kindle/i.test(u))return false;if(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)return false;return true}catch(e){return false}}
let fsTried=false;const fsKey=()=>isPC()?'pdb_fs_pc':'pdb_fs',fsPref=()=>{try{const v=localStorage.getItem(fsKey());return v==null?!isPC():v!=='0'}catch(e){return !isPC()}};
function goLandscape(){const d=document.documentElement;if(document.fullscreenElement||!d.requestFullscreen)return Promise.resolve(false);
  return d.requestFullscreen({navigationUI:'hide'}).then(()=>screen.orientation&&screen.orientation.lock?screen.orientation.lock('landscape').then(()=>true,()=>false):false,()=>false).then(ok=>{setTimeout(fit,150);setTimeout(fit,500);return ok})}
// every tap re-enters fullscreen while the setting is on (a Google sign-in popup or the back gesture drops out of it), so the browser's address bar stays hidden
const fsWant=e=>{if(!fsPref()||document.fullscreenElement||matchMedia('(display-mode:fullscreen),(display-mode:standalone)').matches)return;if(e.target&&e.target.closest&&e.target.closest('[data-act=glogin],[data-act=fstog]'))return;fsTried=true;goLandscape()};
addEventListener('pointerup',fsWant,true);addEventListener('click',fsWant,true);
document.addEventListener('fullscreenchange',()=>{setTimeout(fit,150);if(!document.fullscreenElement&&isPC()){try{localStorage.setItem(fsKey(),'0')}catch(e){}}});if(screen.orientation)screen.orientation.addEventListener('change',()=>setTimeout(fit,150));
document.addEventListener('focusin',ev=>{const n=ev.target,chat=n.id==='chi';if((n.id!=='nm'&&!chat)||innerHeight<=innerWidth||$('kb'))return;n.blur();
  const en=S.lang==='en',lab=chat?(en?'Chat (up to 40 characters)':'แชท (ไม่เกิน 40 ตัวอักษร)'):(en?'Name (up to 12 characters)':'ชื่อ (ไม่เกิน 12 ตัวอักษร)'),max=chat?40:12;
  const k=document.createElement('div');k.id='kb';k.innerHTML=`<label for="kbi">${lab}</label><input id="kbi" maxlength="${max}" autocomplete="off" enterkeyhint="${chat?'send':'done'}"><div class="row"><button class="btn go" id="kbo">${chat?(en?'Send':'ส่ง'):(en?'OK':'ตกลง')}</button><button class="btn alt" id="kbc">${en?'Cancel':'ยกเลิก'}</button></div>`;
  document.body.append(k);const i=$('kbi');i.value=n.value;const done=ok=>{if(ok){if(chat)chatSend(i.value);else n.value=i.value.slice(0,12)}k.remove()};
  $('kbo').onclick=()=>done(true);$('kbc').onclick=()=>done(false);i.onkeydown=e=>{if(e.key==='Enter')done(true)};setTimeout(()=>i.focus(),30)});
S=load();try{const l=localStorage.getItem('pdb_lang');if(l&&!USER)S.lang=l}catch(e){}document.documentElement.lang=S.lang||'th';USER?loading(USER.sub?cloudPull().catch(()=>{}):null):titleScreen();
</script>
