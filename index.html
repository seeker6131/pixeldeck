<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c1030">
<title>Pixeldeck Battle</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<title>Pixeldeck Battle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: a landscape stage — a narrow status rail on the left, the working area (board, cards, shop) on the right. */
:root{
  color-scheme:dark;
  --night:#1d2b53; --panel:#2a3a6e; --deep:#121a36; --ink:#fff1e8; --dim:#c2c3c7;
  --red:#ff004d; --yellow:#ffec27; --green:#00e436; --blue:#29adff; --orange:#ffa300; --plum:#7e2553; --lav:#83769c;
  --st:#b08a5a; --c:#a9adb8; --uc:#3ddc5a; --r:#4aa8ff; --l:#ffd23a; --sl:#ff9d1a;
  --display:"Pixelify Sans","Chakra Petch",system-ui,sans-serif;
  --body:"Chakra Petch","Pixelify Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4}
/* the game is always a landscape stage; on an upright phone the stage is turned 90 degrees */
#stage{position:fixed;left:0;top:0;transform-origin:top left;padding-block:10px;padding-inline:16px;overflow:hidden}
#view{height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1{font-family:var(--display);font-size:30px;line-height:1;margin:0;color:var(--yellow);text-shadow:3px 3px 0 var(--red)}
h2{font-family:var(--display);font-size:20px;line-height:1.1;margin:0;color:var(--yellow)}
p{margin:0}
.px{border:3px solid var(--deep);background:var(--panel);box-shadow:0 4px 0 var(--deep)}
.btn{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2;padding:7px 12px;border:3px solid var(--deep);background:var(--yellow);color:var(--deep);box-shadow:0 4px 0 var(--deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.btn.alt{background:var(--panel);color:var(--ink)}
.btn.go{background:var(--red);color:var(--ink)}
.btn.sm{font-size:14px;padding:4px 8px}
.btn.on{background:var(--green);color:var(--deep)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;height:100%}
.rail{display:grid;gap:7px;align-content:start;min-height:0;overflow-y:auto;padding-bottom:6px}
.main{min-height:0;overflow-y:auto;padding:18px 20px}
.num{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.gold{color:var(--yellow)}.dia{color:var(--blue)}
.sub{font-size:12px;color:var(--dim)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:grid;gap:2px;text-align:left;padding:10px 12px;font-family:var(--display);font-size:20px;font-weight:700}
.tile span{font-family:var(--body);font-size:12px;font-weight:500;color:var(--dim)}
/* rarity: each tier sets --gl; the frame glow is drawn from it */
.r-ST{--gl:var(--st)}.r-C{--gl:var(--c)}.r-UC{--gl:var(--uc)}.r-R{--gl:var(--r)}.r-L{--gl:var(--l)}.r-SL{--gl:var(--sl)}.r-LT{--gl:#bff3ff}
.glow{--ln:color-mix(in srgb,var(--gl) 45%,#fff);box-shadow:0 0 0 2px var(--ln),0 0 7px 3px var(--gl),0 0 18px 6px color-mix(in srgb,var(--gl) 70%,transparent),0 0 34px 10px color-mix(in srgb,var(--gl) 30%,transparent)}
.r-C.glow{box-shadow:0 0 0 2px var(--c)}
/* Rare and above move: the halo breathes and stars twinkle on the frame */
.r-R.glow{animation:pulse 1.6s ease-in-out infinite alternate}
.r-L.glow{--gb:30px;--gs:10px;animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 2px var(--ln),0 0 5px 2px var(--gl),0 0 12px 4px color-mix(in srgb,var(--gl) 55%,transparent),0 0 22px 6px color-mix(in srgb,var(--gl) 20%,transparent)}
  to{box-shadow:0 0 0 2px var(--ln),0 0 10px 4px var(--gl),0 0 var(--gb,24px) var(--gs,8px) color-mix(in srgb,var(--gl) 80%,transparent),0 0 calc(var(--gb,24px)*1.8) calc(var(--gs,8px)*1.6) color-mix(in srgb,var(--gl) 38%,transparent)}}
.spr canvas.hf{position:absolute;z-index:auto;transform:none;filter:none;image-rendering:pixelated;pointer-events:none;top:auto;left:-22%;width:144%;bottom:2%;height:88%;-webkit-mask:linear-gradient(90deg,transparent,#000 20% 80%,transparent);mask:linear-gradient(90deg,transparent,#000 20% 80%,transparent)}
.spr canvas.hf.k-LTs{height:108%;left:-28%;width:156%}
.spr canvas.hf.k-Ls{left:-14%;width:128%;top:-6%;bottom:auto;height:112%;-webkit-mask:none;mask:none;filter:drop-shadow(0 0 2px rgba(255,200,0,.7))}
.spr>.sp{width:22%;z-index:auto}
.sp{position:absolute;z-index:3;width:17%;aspect-ratio:1;background:#fff;pointer-events:none;clip-path:polygon(50% 0,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0 50%,43% 43%);transform:translate(-50%,-50%) scale(0);animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,60%,100%{transform:translate(-50%,-50%) scale(0)}80%{transform:translate(-50%,-50%) scale(1)}}
/* fire frame: a pixel fire simulation drawn on a canvas that sits behind the card and overhangs every edge */
.fire{isolation:isolate}
.firec{position:absolute;z-index:-1;left:-17.5%;top:-13.7%;width:135%;height:127.4%;image-rendering:pixelated;pointer-events:none}
.fire.glow{animation:none;box-shadow:0 0 0 2px #ffec27,0 0 16px 5px rgba(255,90,0,.45)}
.fire.f-LT.glow{box-shadow:0 0 0 2px #bfeeff,0 0 28px 12px rgba(40,140,255,.6)}.fire.f-L.glow{box-shadow:0 0 0 2px #ffe27a,0 0 18px 6px rgba(255,190,30,.5)}
.firec.k-LT{transform:scale(.96,.95)}.firec.k-L{z-index:3;filter:drop-shadow(0 0 2px rgba(255,200,0,.7))}
/* rarity banner drawn over the caption strip of the card art */
.cnm{position:absolute;left:12.5%;right:12.5%;top:5.4%;height:7.4%;display:grid;place-items:center;background:none;color:#fff;font-family:var(--display);font-weight:700;font-size:6.4cqw;text-shadow:.5cqw .5cqw 0 #000;letter-spacing:.04em;line-height:1;white-space:nowrap;text-transform:uppercase;overflow:hidden}
.chp{position:absolute;top:16.6%;height:6.4%;min-width:22%;padding:0 2cqw;display:grid;place-items:center;background:rgba(8,10,24,.96);color:#fff;font-family:var(--display);font-weight:700;font-size:4.4cqw;line-height:1;white-space:nowrap}
.chp.l{left:10.5%}.chp.r{right:10.5%;color:#ffd98a}
.ban{position:absolute;left:10%;right:10%;top:64%;height:6.4%;display:grid;place-items:center;background:none;text-shadow:.4cqw .4cqw 0 #000;color:var(--gl);font-family:var(--display);font-weight:700;font-size:5.2cqw;letter-spacing:.08em;line-height:1;white-space:nowrap}
.pan{position:absolute;left:9.6%;right:9.6%;top:75.4%;height:14.6%;display:grid;grid-template-columns:28.4cqw 1fr 28.4cqw;align-items:center;justify-items:center;gap:0;padding:0;
  background:linear-gradient(#3a2a5c,#1a1230);box-shadow:inset 0 0 0 .8cqw #0a0e22,inset 0 0 0 1.5cqw #d9a441;font-family:var(--display);font-weight:700;line-height:1}
.sb{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:center;gap:.2cqw 1cqw;padding:0;background:none;min-width:0;width:100%}
.sb.a{--sc:#ff7a4d}.sb.m{--sc:#c98bff}.sb.d{--sc:#5cb8ff}
.sb img{width:5.6cqw;height:5.6cqw;max-width:none;image-rendering:pixelated}
.sb img{width:4.6cqw!important;height:4.6cqw!important}.sb b{font-size:4.6cqw;letter-spacing:.06em;color:var(--sc);text-align:left;white-space:nowrap}
.sb i{grid-column:1/-1;font-style:normal;font-size:8.6cqw;line-height:1;color:#fff;text-align:center;font-variant-numeric:tabular-nums;text-shadow:.6cqw .6cqw 0 #000}
.amslot{display:grid;place-items:center;width:12cqw;height:12cqw;border-radius:50%;border:.6cqw dashed rgba(217,164,65,.6);color:#d9a441;font-size:8cqw;line-height:1}
.amslot.has{border:0}
/* amulets: a round charm in the amulet's colour */
.amu{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 35%,#4a59a8,#161c44 75%);box-shadow:inset 0 0 0 2px var(--k1),0 0 0 2px #0a0e22,0 0 0 4px #d9a441,0 0 0 6px #0a0e22}
.amslot .amu{width:11cqw;height:11cqw;aspect-ratio:auto;box-shadow:inset 0 0 0 .5cqw var(--k1),0 0 0 .6cqw #0a0e22,0 0 0 1.3cqw #d9a441}
.amu img{width:94%;image-rendering:auto}
.amu.ar-L{box-shadow:inset 0 0 0 2px var(--k1),0 0 0 2px #0a0e22,0 0 0 4px #ffd23a,0 0 0 6px #0a0e22,0 0 10px 4px rgba(255,210,58,.75)}.amu.ar-R{box-shadow:inset 0 0 0 2px var(--k1),0 0 0 2px #0a0e22,0 0 0 4px #4aa8ff,0 0 0 6px #0a0e22}
.amslot .amu.ar-L{box-shadow:inset 0 0 0 .5cqw var(--k1),0 0 0 .6cqw #0a0e22,0 0 0 1.3cqw #ffd23a,0 0 2cqw 1cqw rgba(255,210,58,.7)}.amslot .amu.ar-R{box-shadow:inset 0 0 0 .5cqw var(--k1),0 0 0 .6cqw #0a0e22,0 0 0 1.3cqw #4aa8ff}
.art-L{color:#ffd23a}.art-R{color:#6cbcff}
.amlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin-bottom:18px}
.amrow{display:grid;grid-template-columns:44px 1fr;gap:4px 14px;align-items:center;text-align:left;padding:10px 12px 10px 14px;border:3px solid var(--deep);background:var(--panel);color:var(--ink)}
.mkpick{position:relative;width:40px;margin:7px 8px;padding:0;border:0;background:none;color:var(--ink)}.mkpick small{display:block;text-align:center;font-size:11px;margin-top:5px}.mkpick.on{outline:3px solid var(--yellow);outline-offset:5px}
/* trade room: a walkable plaza; avatars are sorted by depth and tapped to open the trade menu */
.troom{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:4px;padding:5px 10px 8px}
.tfloor{position:relative;overflow:hidden;border:3px solid var(--deep);background:#35603f}
/* the plaza is wider than the screen; the camera slides it so the player stays near the middle */
.tworld{position:absolute;left:0;top:0;height:100%;cursor:pointer;background:
  linear-gradient(90deg,transparent 0 0),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 56px),repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 2px,transparent 2px 56px),
  linear-gradient(#6b5a48 0 40px,#3d6b4a 40px)}
.tworld::before{content:"";position:absolute;left:0;right:0;top:54%;height:34px;background:repeating-linear-gradient(90deg,#c9b48a 0 28px,#bda67a 28px 56px);box-shadow:0 0 0 3px rgba(0,0,0,.25);pointer-events:none}
.tworld .deco{position:absolute;pointer-events:none}
.stall{width:74px;height:46px;background:linear-gradient(#b5793f 0 30%,#7a4a22 30%);box-shadow:0 0 0 3px #0a0e22}
.stall::before{content:"";position:absolute;left:-6px;right:-6px;top:-20px;height:22px;background:repeating-linear-gradient(90deg,var(--aw,#ff004d) 0 12px,#fff1e8 12px 24px);box-shadow:0 0 0 3px #0a0e22}
.fount{width:64px;height:64px;border-radius:50%;background:radial-gradient(#bfe9ff 0 30%,#29adff 32% 58%,#c2c3c7 60%);box-shadow:0 0 0 3px #0a0e22}
.tree{width:44px;height:44px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 30%,#5fbf5a,#1f6b34);box-shadow:0 0 0 3px #0a0e22;transform-origin:50% 100%;animation:idle 2.4s ease-in-out infinite alternate}
.tree::after{content:"";position:absolute;left:17px;top:42px;width:10px;height:14px;background:#7a4a22;box-shadow:0 0 0 3px #0a0e22;z-index:-1}
.lamp{width:8px;height:44px;background:#3b3b46;box-shadow:0 0 0 2px #0a0e22}
.lamp::before{content:"";position:absolute;left:-6px;top:-14px;width:20px;height:16px;background:#ffec27;box-shadow:0 0 0 2px #0a0e22,0 0 18px 8px rgba(255,236,39,.45);animation:glowp 1.6s ease-in-out infinite alternate}
/* character sprites: one sheet, a row per character, three columns (stand, step, step) */
.chs{display:block;width:56px;height:52px;background:url(chars.png) 0 0/168px 2600px;image-rendering:pixelated}
.av{position:absolute;width:64px;margin:-74px 0 0 -32px;padding:0;border:0;background:none;color:#fff;display:grid;justify-items:center}
.av .spr{height:68px;transform:scaleX(-1);filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.av>span.nm{font-size:10px;line-height:1.3;padding:0 4px;background:rgba(10,14,34,.8);white-space:nowrap;margin-top:1px}
.av.me{pointer-events:none}.av.me>span.nm{color:var(--yellow)}
.av.flip .spr{transform:none}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.roomb{display:grid;gap:4px;text-align:left;padding:10px 12px;color:var(--ink);font-family:var(--display);font-size:20px;font-weight:700}
.roomb small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--dim)}
.roomb .bar2{height:8px;background:#000}.roomb .bar2 i{display:block;height:100%;background:var(--green)}
.roomb:disabled{opacity:.5}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:12px}
.chb{display:grid;justify-items:center;gap:2px;padding:6px 2px 4px;border:3px solid var(--deep);background:var(--panel);color:var(--ink);font-size:10px;line-height:1.2;text-align:center}
.chb.on{outline:3px solid var(--yellow);outline-offset:1px}
#tui{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:9999}
.tmenu{pointer-events:auto;display:grid;gap:6px;max-height:98%;overflow:auto;min-width:230px;max-width:86%;padding:12px 14px;background:var(--panel);border:3px solid var(--deep);box-shadow:0 5px 0 var(--deep)}
.tmenu .pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tmenu .mkpick{margin:6px 8px;width:32px}
.looks{display:flex;gap:14px;flex-wrap:wrap;padding:4px}
.swb{width:34px;height:34px;padding:0;border:3px solid var(--deep);box-shadow:0 3px 0 var(--deep)}.swb.on{outline:3px solid var(--yellow);outline-offset:3px}
.avbig{width:84px;height:112px;image-rendering:pixelated;justify-self:center;background:var(--panel);border:3px solid var(--deep)}
.prof{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:6px 8px;text-align:left;color:var(--ink)}
.prof .chs{grid-row:1/3}.prof b{font-size:15px;overflow-wrap:anywhere}.prof small{font-size:12px;color:var(--yellow)}
.lookb{padding:4px;border:3px solid var(--deep);background:var(--panel)}.lookb.on{outline:3px solid var(--yellow)}
.lookb img{display:block;width:42px;height:56px;image-rendering:pixelated}
#nm{font:inherit;font-size:16px;padding:6px 8px;border:3px solid var(--deep);background:#fff1e8;color:#121a36;width:100%}
.amrow.on{outline:3px solid var(--yellow);outline-offset:1px}
.amrow b{font-size:14px}.amrow small{display:block;font-size:12px;color:var(--dim);line-height:1.35}
.rib{display:block;font-family:var(--display);font-weight:700;font-size:11px;line-height:1.35;text-align:center;background:var(--gl);color:var(--deep);letter-spacing:.04em}
/* crops the picture window out of a full card image */
.art{position:relative;aspect-ratio:1.3;overflow:hidden;background:var(--deep);width:100%}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art .nm{position:absolute;left:0;right:0;bottom:0;font-size:10px;line-height:1.3;text-align:center;background:rgba(18,26,54,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{position:relative;display:block;padding:0;border:0;background:var(--deep);color:var(--ink);text-align:center;min-width:0;width:100%}
.st{display:flex;justify-content:space-between;gap:2px;padding:0 4px;font-family:var(--display);font-size:12px;line-height:1.5;font-variant-numeric:tabular-nums}
.mini .st{background:var(--deep)}
.st .a{color:var(--orange)}.st .d{color:var(--blue)}
.hp{height:7px;background:#000}
.hp i{display:block;height:100%;background:var(--green);transition:width .2s steps(5)}
.xp i{background:var(--blue)}
.tag{display:inline-block;white-space:nowrap;font-size:9px;background:var(--plum);padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:24px 22px}
.mini.sel{outline:3px solid var(--yellow);outline-offset:3px}
.grid.big{grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 22px}
.cap{text-align:center;margin-top:8px}
.cf.sel{outline:4px solid var(--yellow);outline-offset:5px}
.cf .ord{top:-10px;right:-10px;z-index:4;min-width:28px;font-size:20px;line-height:1.3;box-shadow:0 0 0 3px var(--deep)}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:5px 4px}
.picks .empty{display:grid;place-items:center;aspect-ratio:.754;border:3px dashed var(--lav);color:var(--lav);font-family:var(--display);font-size:22px}
.picks .sp{display:none}
.tab{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.5;padding:1px 8px;text-align:left;border:3px solid var(--deep);background:var(--gl,var(--panel));color:var(--deep);opacity:.55}
.tab:not([class*="r-"]){color:var(--ink)}.tab.am{background:#d9a441;color:var(--deep)}
.tab.on{opacity:1;outline:3px solid var(--yellow);outline-offset:1px}
.ord{position:absolute;z-index:1;top:14px;right:0;min-width:20px;font-family:var(--display);font-weight:700;background:var(--yellow);color:var(--deep)}
.cf{position:relative;container-type:inline-size;display:block;padding:0;border:0;background:none;color:var(--ink);text-align:center;min-width:0;width:100%}
.cf>img{display:block;width:100%;aspect-ratio:540/716}
.cf.glow{box-shadow:none!important;animation:none!important}.cf.glow>img{filter:drop-shadow(0 0 1.2cqw color-mix(in srgb,var(--gl) 80%,transparent))}.cf.r-C.glow>img,.cf.r-ST.glow>img{filter:none}.cf.sel>img{filter:drop-shadow(0 0 2px var(--yellow)) drop-shadow(0 0 6px var(--yellow))}.cf.sel{outline:0!important}
.cf.lock img{filter:grayscale(1) brightness(.45)}
/* battle: side view, your team stacked on the left, enemies on the right, the middle is the lane attacks cross */
.arena{position:relative;overflow:hidden;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:2px;padding:5px 10px 6px;background:#121a36}
.arena>.atop,.arena>.field{position:relative;z-index:1}
.arena>.atop{background:rgba(10,14,34,.62);margin:-5px -10px 0;padding:4px 10px}
/* stage backdrop: the painting, a swaying copy of its tree line, drifting fog, a moving glow on lava or crystal ground, and a particle canvas */
.bgl{position:absolute;inset:0;background-size:100% 100%;pointer-events:none}
.bgl.lowr{clip-path:inset(25% 0 0 0)}
.bgl.top{clip-path:inset(0 0 74.6% 0);transform-origin:50% 25%;animation:sway 2.8s ease-in-out infinite alternate}
@keyframes sway{from{transform:scaleX(1.04) skewX(-3.2deg)}to{transform:scaleX(1.04) skewX(3.2deg)}}
.bfog{position:absolute;inset:8% -40% 30% -40%;pointer-events:none;opacity:.55;animation:fogm 16s ease-in-out infinite alternate;
  background:radial-gradient(ellipse 22% 42% at 15% 45%,var(--fc,#fff),transparent 70%),radial-gradient(ellipse 26% 36% at 48% 60%,var(--fc,#fff),transparent 70%),radial-gradient(ellipse 20% 44% at 80% 40%,var(--fc,#fff),transparent 70%)}
@keyframes fogm{from{transform:translateX(-18%)}to{transform:translateX(18%)}}
.bglow{position:absolute;inset:24% 0 0 0;pointer-events:none;mix-blend-mode:screen;background:repeating-linear-gradient(105deg,transparent 0 10%,var(--gc) 17%,transparent 25%);background-size:200% 100%;animation:glowm 6s linear infinite,glowp 2.2s ease-in-out infinite alternate}
@keyframes glowm{to{background-position:-200% 0}}
@keyframes glowp{from{opacity:.12}to{opacity:.5}}
.baur{position:absolute;inset:0 0 70% 0;pointer-events:none;mix-blend-mode:screen;opacity:.5;background:linear-gradient(90deg,#3dffb0,#4aa8ff,#b06cff,#3dffb0,#4aa8ff);background-size:300% 100%;-webkit-mask:linear-gradient(#000 30%,transparent);mask:linear-gradient(#000 30%,transparent);animation:glowm 10s linear infinite}
#bgfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated}
.mapth{width:100%;aspect-ratio:2;border:3px solid var(--deep);background-size:cover}
.atop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.alog{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field{position:relative;min-height:0;--bw:min(80px,calc(var(--H)*.19))}
.pos{position:absolute;width:calc(var(--cw)*1.3)}
/* fighters: the character cut out of its card stands on the floor; rank shows as a glow around the silhouette */
.fig{position:relative;display:grid;justify-items:center;gap:0;width:100%;padding:0;border:0;background:none;color:var(--ink);flex:none}
/* nameplate floating over the head: life bar, then attack and life numbers */
.plate{position:relative;display:grid;justify-items:center;gap:1px;width:100%;margin-bottom:calc(var(--cw)*-.06);z-index:2}
.fig .fhp{position:relative;width:62%;height:6px}.fig .fhp i{display:block;height:100%;transition:width .2s steps(5)}
.fig .fhp b{position:absolute;left:0;top:0;height:100%;background:repeating-linear-gradient(90deg,#9fe6ff 0 4px,#4fb8ff 4px 6px);opacity:.92}
.fig .st{display:flex;gap:7px;justify-content:center;font-family:var(--display);font-weight:700;font-size:calc(var(--cw)*.15);line-height:1.1;white-space:nowrap;text-shadow:1px 1px 0 #0a0e22,-1px -1px 0 #0a0e22,1px -1px 0 #0a0e22,-1px 1px 0 #0a0e22,0 2px 3px #000}
.fig .st span{display:flex;align-items:center;gap:2px}.fig .st img{width:calc(var(--cw)*.13);height:calc(var(--cw)*.13);image-rendering:pixelated;filter:drop-shadow(0 1px 0 #0a0e22)}
.fig .st .a{color:#ffb27a}.fig .st .a.m{color:#9fd4ff}.fig .st .d{color:#e8f0ff}
.fig .shv{color:#8fdcff;font-weight:700;margin-left:2px}
.fig .tagb,.fig .tnt{position:static;font-family:var(--display);font-weight:700;font-size:9px;padding:0 5px;line-height:1.25;color:#fff}.fig .tagb{background:var(--red)}.fig .tnt{background:#1f58b5}
/* every fighter casts a soft contact shadow on the floor; the one whose turn it is stands on a yellow ring */
.fig .sw{position:relative}
.fig .sw::before{content:"";position:absolute;left:4%;right:4%;bottom:-8%;height:20%;border-radius:50%;background:radial-gradient(ellipse closest-side,rgba(0,0,0,.88) 0 35%,rgba(0,0,0,.55) 70%,transparent)}
.fig.act .sw::before{background:radial-gradient(ellipse closest-side,rgba(0,0,0,.6) 0 52%,rgba(255,220,60,.95) 62% 80%,transparent 92%);animation:ringp 1s ease-in-out infinite alternate}
.fig.dead .sw::before{opacity:.25}
.fig .sw{display:block;width:100%;height:calc(var(--cw)*1.28)}.fig .sw.flip{transform:scaleX(-1)}

/* idle: every fighter breathes and sways from the feet; slime wobbles, flyers hover */
.spr{position:relative;display:block;aspect-ratio:176/216;height:100%;flex:none}
/* one sheet per character: 6 frames across, rows = idle, walk, attack, front idle */
.spr>i{position:absolute;left:50%;bottom:-3%;height:128%;aspect-ratio:336/272;margin-left:calc(128%*-.5*336/272*216/176);overflow:hidden;pointer-events:none}
.spr img{position:absolute;left:0;top:0;display:block;width:600%;height:400%;max-width:none;image-rendering:pixelated;--ry:0%;transform:translate(0,var(--ry));animation:fr6 .84s steps(6) infinite;will-change:transform}
@keyframes fr6{from{transform:translate(0,var(--ry))}to{transform:translate(-100%,var(--ry))}}
.spr.walk img{--ry:-25%}.spr.front img{--ry:-75%}
.spr.atk img{--ry:-50%;animation:fr6 var(--ad,.5s) steps(6) 1}
.fig .spr{margin:0 auto;transform-origin:50% 100%;animation:var(--aura,none) .5s steps(3) infinite alternate}
.fig.i-jelly .spr{--idle:jelly;animation-duration:.8s,.5s}.fig.i-hover .spr{--idle:hover}
@keyframes idle{from{transform:rotate(-1.8deg) scale(1,1)}to{transform:rotate(1.8deg) scale(1.02,1.045)}}
@keyframes jelly{from{transform:scale(1.08,.92)}to{transform:scale(.94,1.07)}}
@keyframes hover{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-8px) rotate(2deg)}}
@keyframes blaze{to{filter:drop-shadow(0 0 3px #fff3b0) drop-shadow(0 -6px 11px #ff2a00)}}
/* attack effects: slash arc and ground slam on the target, projectiles crossing the lane */
.arc{position:absolute;z-index:5;left:5%;top:0;width:90%;aspect-ratio:1;border-radius:50%;border:0 solid transparent;border-right:8px solid #fff;filter:drop-shadow(0 0 5px #9fd8ff);pointer-events:none;animation:arc .26s ease-out forwards}
.arc.rv{border-right:0;border-left:8px solid #fff;animation-name:arcR}
@keyframes arc{from{transform:rotate(-80deg);opacity:1}to{transform:rotate(70deg);opacity:0}}
@keyframes arcR{from{transform:rotate(80deg);opacity:1}to{transform:rotate(-70deg);opacity:0}}
.slam{position:absolute;z-index:5;left:-25%;right:-25%;bottom:10px;height:20px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 10px 3px #ffd98a;pointer-events:none;animation:slam .32s ease-out forwards}
@keyframes slam{from{transform:scale(.15);opacity:1}to{transform:scale(1.25);opacity:0}}
.aur{position:absolute;z-index:5;inset:8% 0 12%;border-radius:50%;border:3px solid var(--green);box-shadow:0 0 12px 4px var(--green),inset 0 0 12px 2px var(--green);pointer-events:none;animation:slam .5s ease-out forwards}
.pj{position:absolute;z-index:9;pointer-events:none;width:0;height:0}
.pj i{position:absolute;display:block;left:0;top:0;transform:translate(-50%,-50%)}
.pj.arrow i{width:38px;height:4px;background:linear-gradient(90deg,#f1f5f9 0 14%,#8b5a2b 14% 78%,#dfe7ef 78%);box-shadow:0 0 0 1px #0a0e22,0 0 6px #fff}
.pj.fire i,.pj.moon i,.pj.light i,.pj.soul i{width:24px;height:24px;border-radius:50%;background:radial-gradient(#fff 0 18%,var(--p1) 45%,var(--p2) 72%,transparent 74%);box-shadow:0 0 14px 6px var(--p2),-18px 0 14px 2px var(--p2),-34px 0 12px 0 color-mix(in srgb,var(--p2) 55%,transparent)}
.pj.fire{--p1:#ffd23a;--p2:#ff4a00}.pj.moon{--p1:#cfe9ff;--p2:#4aa8ff}.pj.light{--p1:#fff6c2;--p2:#ffd23a}.pj.soul{--p1:#b6ffd9;--p2:#19c37d}
.fig .tagb{position:absolute;top:-11px;font-family:var(--display);font-weight:700;font-size:10px;background:var(--red);padding:0 5px;line-height:1.2}
.fig.act::before{content:"";position:absolute;z-index:3;top:-13px;left:50%;margin-left:-7px;border:7px solid transparent;border-top:9px solid var(--yellow);animation:bob .5s steps(2) infinite alternate}
.fig.dead .spr img{animation:none}.fig.dead .spr{animation:none;filter:grayscale(1) brightness(.45);opacity:.4;transform:rotate(-78deg) translate(-12%,22%)}
.fig.dead .plate{opacity:.2}
/* action bar: whose turn it is and their three skills, centred at the bottom of the floor */
.abar{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:120;display:flex;align-items:center;gap:12px;padding:5px 14px 5px 6px;background:linear-gradient(180deg,rgba(28,36,92,.92),rgba(10,14,34,.94));border:2px solid #080b1f;box-shadow:inset 0 2px 0 rgba(150,200,255,.25),0 3px 0 rgba(0,0,0,.5)}
.abar.wait{opacity:.72}
.aport{display:block;width:38px;flex:none;border:2px solid var(--gl,#6f7cc0)}.aport .art{aspect-ratio:1}
.anm{display:grid;min-width:92px;max-width:150px;text-align:left;line-height:1.15}.anm b{font-family:var(--display);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.anm small{font-size:10px;color:#c8d2ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.anm i{font-style:normal;color:#ffe45c}
.abar .sk{width:38px;height:38px}.abar .sk .cd{font-size:20px}
.order{position:absolute;left:50%;top:2px;transform:translateX(-50%);z-index:120;display:flex;gap:4px;align-items:flex-start;padding:3px 5px;background:rgba(10,14,34,.5)}
.op{display:block;width:20px;border:2px solid var(--blue)}.op.en{border-color:var(--red)}.op.now{width:28px;outline:2px solid var(--yellow);outline-offset:1px}
.op .art,.vp .art{aspect-ratio:1}
.arena .fl{z-index:130;top:34%;font-size:20px;text-shadow:2px 2px 0 #0a0e22,-2px -2px 0 #0a0e22,2px -2px 0 #0a0e22,-2px 2px 0 #0a0e22;animation:pop .85s ease-out forwards}
.arena .fl.p{color:#ff5a4a}.arena .fl.m{color:#6fd0ff}.arena .fl.g{color:#5dff7a;font-size:23px}.arena .fl.s{color:#bfeaff;font-size:17px}
.arena .fl.pc{color:#ff2a1a;font-size:40px;text-shadow:2px 2px 0 #3a0500,-2px -2px 0 #3a0500,2px -2px 0 #3a0500,-2px 2px 0 #3a0500,0 0 12px #ffb000;animation-name:popc}
.arena .fl.mc{color:#2f6cff;font-size:40px;text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,0 0 12px #2a8cff;animation-name:popc}
@keyframes pop{0%{transform:translate(-50%,10px) scale(.6);opacity:0}15%{transform:translate(-50%,-6px) scale(1.15);opacity:1}30%{transform:translate(-50%,-10px) scale(1)}100%{transform:translate(-50%,-46px) scale(1);opacity:0}}
@keyframes popc{0%{transform:translate(-50%,10px) scale(.4) rotate(-8deg);opacity:0}14%{transform:translate(-50%,-10px) scale(1.5) rotate(4deg);opacity:1}28%{transform:translate(-50%,-14px) scale(1) rotate(0)}75%{opacity:1}100%{transform:translate(-50%,-58px) scale(1);opacity:0}}
.imp{position:absolute;z-index:4;left:50%;top:45%;width:80%;aspect-ratio:1;background:#fff;pointer-events:none;clip-path:polygon(50% 0,60% 35%,100% 20%,70% 50%,100% 80%,60% 65%,50% 100%,40% 65%,0 80%,30% 50%,0 20%,40% 35%);animation:imp .35s steps(5) forwards}
@keyframes imp{from{transform:translate(-50%,-50%) scale(.3) rotate(0);opacity:1}to{transform:translate(-50%,-50%) scale(1.5) rotate(25deg);opacity:0}}
/* overlays: VS intro, START / FINISH banners, skill cut-ins */
#ov{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.bn{position:absolute;left:0;right:0;top:50%;height:84px;transform:translateY(-50%);display:grid;place-items:center;background:linear-gradient(90deg,transparent,rgba(10,14,34,.92) 18% 82%,transparent);animation:bn .85s both}
.bn span{font-family:var(--display);font-weight:700;font-style:italic;font-size:58px;letter-spacing:.08em;color:var(--yellow);text-shadow:4px 4px 0 var(--red),0 0 20px #ff8a00;animation:pop .3s both}
.bn.lose span{color:var(--dim);text-shadow:4px 4px 0 #0a0e22}
@keyframes bn{0%{clip-path:inset(50% 0)}16%,82%{clip-path:inset(0)}100%{clip-path:inset(50% 0)}}
@keyframes pop{from{transform:scale(3);opacity:0}}
@keyframes slideL{from{transform:translateX(-140%)}}
@keyframes slideR{from{transform:translateX(140%)}}
.vs{position:absolute;inset:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:linear-gradient(100deg,#16307a 0 49.4%,#fff1e8 49.4% 50.6%,#7a1630 50.6%)}
.vl,.vr{display:flex;gap:12px;justify-content:center}
.vp{width:min(92px,11vmax);border:3px solid #0a0e22;box-shadow:0 5px 0 #0a0e22;animation:slideL .4s both}.vr .vp{animation-name:slideR}
.vs b{font-family:var(--display);font-style:italic;font-size:76px;line-height:1;color:var(--yellow);text-shadow:5px 5px 0 var(--red),0 0 22px #ff8a00;animation:pop .35s .25s both}
.dim{position:absolute;inset:0;background:rgba(10,14,34,.6)}
.cut{--k1:#ff7a6b;--k2:#b3122f;position:absolute;left:-6%;right:-6%;top:50%;height:46%;transform:translateY(-50%) rotate(-4deg);display:flex;align-items:center;gap:26px;padding-left:14%;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 3px,transparent 3px 46px),linear-gradient(90deg,var(--k2),var(--k1));box-shadow:0 0 0 4px #0a0e22,0 0 0 9px var(--k1),0 0 0 13px #0a0e22;animation:cut .75s both}
.cut.t-aoe{--k1:#ffc04d;--k2:#d9480f}.cut.t-exec{--k1:#d59bff;--k2:#6a1fb5}.cut.t-drain{--k1:#ff7ab8;--k2:#8a1158}
.cut.t-heal,.cut.t-healall{--k1:#8dffa0;--k2:#118a3c}.cut.t-guard{--k1:#8fd3ff;--k2:#1f58b5}.cut.t-buff{--k1:#ffe98a;--k2:#c98a00}
.cut.ult{height:74%;animation-duration:1s;box-shadow:0 0 0 4px #0a0e22,0 0 0 9px #ffd23a,0 0 0 13px #0a0e22,0 0 40px 18px rgba(255,210,58,.6)}
.cutart{width:min(200px,24vmax);flex:none;border:4px solid #0a0e22;box-shadow:6px 6px 0 rgba(10,14,34,.6);animation:slideL .28s both}
.cutname{font-family:var(--display);font-weight:700;font-style:italic;font-size:42px;line-height:1.1;color:#fff;text-shadow:3px 3px 0 #0a0e22,-2px -2px 0 #0a0e22;animation:slideR .28s both}
.cutname small{display:block;font-size:15px;font-style:normal;letter-spacing:.06em}
@keyframes cut{0%{clip-path:inset(50% 0)}14%,84%{clip-path:inset(-20% 0)}100%{clip-path:inset(-20% 0 -20% 100%)}}
/* hollow star slots */
.stars{position:absolute;z-index:2;left:0;right:0;display:flex;justify-content:center;gap:1.5%;pointer-events:none}
.cf .stars{top:55.8%}.cf .stars svg{width:7.5%}
.mini .stars{bottom:15px}.mini .stars svg{width:11px}
.stars svg{display:block;aspect-ratio:1;fill:rgba(10,14,34,.7);stroke:#ffd98a;stroke-width:2.2;stroke-linejoin:round;paint-order:stroke}
.stars svg.on{fill:var(--yellow)}
/* skill buttons: a bevelled gem in the skill's colour inside a dark pixel frame */
.sk{--k1:#ff7a6b;--k2:#b3122f;position:relative;display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;flex:none;
  background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.55),transparent 42%),linear-gradient(160deg,var(--k1),var(--k2));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),inset 0 -5px 0 rgba(0,0,0,.28),0 0 0 2px #0a0e22,0 0 0 4px var(--k2),0 0 0 6px #0a0e22}
.sk{background:radial-gradient(circle at 50% 40%,#2a3360,#0c1026 75%)!important}.sk img{width:92%!important;height:92%!important;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.sk.t-sure{--k1:#ff9a6b;--k2:#c2410c}.sk.t-shieldall{--k1:#8fd3ff;--k2:#1f58b5}.sk.t-rally{--k1:#ffe98a;--k2:#c98a00}
.sk.t-aoe{--k1:#ffc04d;--k2:#d9480f}.sk.t-exec{--k1:#d59bff;--k2:#6a1fb5}.sk.t-drain{--k1:#ff7ab8;--k2:#8a1158}
.sk.t-heal,.sk.t-healall{--k1:#8dffa0;--k2:#118a3c}.sk.t-guard{--k1:#8fd3ff;--k2:#1f58b5}.sk.t-buff{--k1:#ffe98a;--k2:#c98a00}
.sk.ult{box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),inset 0 -5px 0 rgba(0,0,0,.28),0 0 0 2px #0a0e22,0 0 0 4px #ffd23a,0 0 0 6px #0a0e22,0 0 12px 5px rgba(255,210,58,.65);animation:ult 1.2s ease-in-out infinite alternate}
@keyframes ult{to{box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),inset 0 -5px 0 rgba(0,0,0,.28),0 0 0 2px #0a0e22,0 0 0 4px #fff3b0,0 0 0 6px #0a0e22,0 0 20px 9px rgba(255,210,58,.85)}}
.sk.pick{outline:3px solid var(--yellow);outline-offset:6px}
.sk:disabled{cursor:default}
.sk.off{filter:saturate(.25) brightness(.6);animation:none}
.sk .cd{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;color:#fff;text-shadow:2px 2px 0 #0a0e22;background:rgba(10,14,34,.55)}
.skl{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;align-items:center;margin-top:6px}
.skl p{font-size:12px;line-height:1.3;color:var(--dim)}.skl b{color:var(--ink);font-size:13px}
.mini.act{outline:3px solid var(--yellow);outline-offset:3px}
.mini.dead{box-shadow:none!important;animation:none;background:transparent}.mini.dead>:not(.fl):not(.imp){opacity:.22}
.mini.boss .rib{background:var(--red);color:var(--ink)}
.fl{position:absolute;left:50%;top:30%;z-index:2;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:24px;white-space:nowrap;text-shadow:2px 2px 0 var(--deep),-2px -2px 0 var(--deep);animation:up .7s steps(7) forwards;pointer-events:none}
.fl.d{color:var(--yellow)}.fl.g{color:var(--green)}.fl.s{color:#8fdcff}.fl.c{color:#ff5a3c;font-size:1.35em;text-shadow:2px 2px 0 #2a0500,-2px -2px 0 #2a0500,0 0 10px #ffb000}
@keyframes up{to{top:0;opacity:0}}
.pack{display:grid;place-items:center;height:74px;font-family:var(--display);font-weight:700;font-size:16px;text-align:center;line-height:1.1;background:repeating-linear-gradient(45deg,var(--plum) 0 8px,var(--panel) 8px 16px)}
.pull{display:grid;grid-template-columns:repeat(3,minmax(0,150px));gap:16px;justify-content:center;padding-top:6px}
.pull>div{display:grid;gap:5px;text-align:center;animation:pop .35s steps(5) backwards}
.pull>div:nth-child(2){animation-delay:.35s}.pull>div:nth-child(3){animation-delay:.7s}
@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}}
.odds{display:grid;grid-template-columns:1fr auto;gap:0 8px;font-size:12px}
.res{display:grid;grid-template-columns:64px 1fr;gap:18px 16px;align-items:center;max-width:440px;padding:6px 8px}
/* result rows: a tight coloured frame only — the big halo and fire belong on full cards and would spill over the neighbouring rows here */
.res .mini.glow{animation:none;box-shadow:0 0 0 2px var(--ln,var(--c)),0 0 5px 1px var(--gl)}
.res .mini.r-C.glow{box-shadow:0 0 0 2px var(--c)}
.res .mini.fire.glow{box-shadow:0 0 0 2px #ffec27,0 0 6px 2px #ff5a00}
.res .firec,.res .sp{display:none}
.res .rib{font-size:8px;letter-spacing:0;overflow:hidden;white-space:nowrap}
#zoom{position:absolute;inset:0;z-index:9;background:rgba(18,26,54,.94);display:flex;gap:70px;align-items:center;justify-content:center;padding:16px;border:0;width:100%;text-align:left}
#zoom .cf{width:calc((var(--H) - 110px)*.754);flex:none}
#zoom .inf{display:grid;gap:5px;max-width:330px}
.stb{display:grid;gap:3px;padding:7px 9px;background:#141a33;border:2px solid #3b4a7a;box-shadow:0 0 0 2px #0a0e22,inset 0 0 0 1px rgba(255,255,255,.06)}
.stb span{display:grid;grid-template-columns:14px 52px 62px 1fr;align-items:center;gap:6px;font-size:13px;line-height:1.25}
.stb img{width:12px;height:12px;image-rendering:pixelated}.stb b{font-weight:700;color:var(--ink)}.stb b.k{grid-column:1/3;color:var(--dim)}
.stb i{font-style:normal;font-family:var(--display);font-weight:700;color:#fff;font-size:15px}.stb u{text-decoration:none;color:#5fe36a;font-size:12px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.fl,.pull>div{animation-timing-function:linear}.glow{animation:none!important}.sp{animation:none;transform:translate(-50%,-50%) scale(.8)}.sk.ult{animation:none}.bn,.bn span,.cut,.cutart,.cutname,.vp,.vs b,.fig .spr,.fig.act::before,.bgl.top,.bfog,.bglow,.baur{animation:none!important}.hp i{transition:none}}

/* ---------- arcade UI kit: every control is a glossy candy block with a dark outline; colour says what it does ----------
   blue = navigate, green = go, yellow = buy / confirm, magenta = switched on, red = destructive */
body{background:radial-gradient(circle at 50% 0,#31449f,#161d4d 70%)}
#stage{background:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 2px) 0 0/22px 22px}
.btn,.tile,.tab,.roomb{--b1:#ffe27a;--b2:#ffb81f;--tx:#1a1436;border:3px solid #10142c;border-radius:11px;color:var(--tx);
  background:linear-gradient(var(--b1) 0 46%,var(--b2) 46%);box-shadow:inset 0 3px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(0,0,0,.2),0 4px 0 #10142c;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn:active,.tile:active,.tab:active,.roomb:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(0,0,0,.2),0 1px 0 #10142c}
.btn.alt{--b1:#8fe3ff;--b2:#29adff;color:var(--tx)}
.btn.go{--b1:#9dff8a;--b2:#2fd24a;color:var(--tx)}

function autoPick(a){const hurtAlly=bt.al.some(x=>x.hp>0&&x.hp<x.max*.6);
  for(const j of[2,1]){const t=SK[a.id][j][2];if(a.cds[j])continue;
    if(t==='heal'||t==='healall'){if(hurtAlly)return j}
    else if(t==='guard'){if(!(a.sh>a.max*.1))return j}
    else if(t==='shieldall'){if(bt.al.some(x=>x.hp>0&&!(x.sh>x.max*.1)))return j}
    else if(t==='buff'){if(a.atk<a.base*2)return j}
    else if(t==='rally'){if(bt.al.some(x=>x.hp>0&&x.atk<x.base*2))return j}
    else return j}
  return 0}
function autoAct(){const a=actor();if(!a)return;bt.sel=autoPick(a);act(autoT())}

  d.className='pj '+type;d.style.left=A.x+'px';d.style.top=A.y+'px';d.innerHTML=`<i style="transform:translate(-50%,-50%) rotate(${Math.atan2(B.y-A.y,B.x-A.x)}rad)"></i>`;$('ov').append(d);

// one attack: wind up, then either cross the lane and swing, or stay put and fire; resolves at the moment of impact
async function strike(from,id,tos,dir){
  const f=$(from);if(!f||RM)return;const spr=f.querySelector('.spr'),st=C[id].st||'slash',sp=S.spd||1;
  const swing=()=>{spr.style.setProperty('--ad',(.5/sp)+'s');spr.classList.remove('atk');void spr.offsetWidth;spr.classList.add('atk')};
  if(st==='shoot'||st==='cast'){swing();await W(300);sfx(st==='shoot'?'arrow':'magic');tos.forEach(t=>shoot(from,t,C[id].pj||'fire'));await W(255);return}
  await lunge(from,tos.length===1?tos[0]:null,dir);swing();await W(240);
  if(st==='smash'){sfx('smash');tos.forEach(t=>addFx(t,'slam'));quake=true}else{sfx('slash');tos.forEach(t=>addFx(t,'arc'+(dir===1?'':' rv')))}
  await W(130)}
async function pose(from,tos){const f=$(from);if(!f||RM)return;
  f.querySelector('.spr').animate([{transform:'none'},{transform:'translateY(-14px) scale(1.06)'},{transform:'none'}],{duration:380/(S.spd||1)});await W(200);sfx('heal');tos.forEach(t=>addFx(t,'aur'));await W(150)} // sprites drawn facing right; mirrored when they fight on the enemy side

function unit(u,el,cls,attr,sp,side){const p=Math.max(0,u.hp/u.max*100),mon=u.boss!==undefined,k=sp[2]*(u.boss?1.18:1);

     <span class="st"><span class="a ${C[u.id].m?'m':''}"><img src="${ICON[MAGIC.includes(u.id)?'orb':'sword']}" alt="${atkName(u.id)}">${u.atk}</span><span class="d"><img src="${ICON.shield}" alt="DEF">${Math.max(0,u.hp)}${u.sh>0&&u.hp>0?`<b class="shv">+${u.sh}</b>`:''}</span></span></span>
    <span class="sw ${mon?'':'flip'}">${sprite(u.id)}</span></button></div>`}
function draw(){
  const ac=busy?null:actor(),ord=[...bt.al.filter(a=>a.hp>0&&!a.done).map(a=>[a,'al']),...bt.en.filter(e=>e.hp>0).map(e=>[e,'en'])];
  view(`<div class="arena px">${bgLayers(bt.n)}
    <div class="atop"><span class="num">ด่าน ${bt.n} · ${MAPS[mapOf(bt.n)-1]} · รอบ ${bt.round}</span><span class="alog" aria-live="polite">${bt.log}</span>
      <span class="row"><button class="btn sm ${S.auto?'on':'alt'}" data-act="auto">ออโต้</button><button class="btn alt sm" data-act="spd">x${S.spd||1}</button><button class="btn red sm" data-act="prep">ถอย</button></span></div>
    <div class="field">
      <div class="order">${ord.map(([u,sd],i)=>`<span class="op ${sd} ${i?'':'now'}">${art(u.id)}</span>`).join('')}</div>

      ${bt.en.map((e,i)=>unit(e,'e'+i,'',`data-act="tgt" data-i="${i}" ${busy||e.hp<=0||S.auto?'disabled':''}`,spots(bt.en.length)[i],1)).join('')}
      ${(()=>{const a=ac||actor()||bt.al.find(x=>x.hp>0);if(!a)return '';const live=a===ac&&!S.auto;
        return `<div class="abar ${live?'':'wait'}"><span class="aport r-${C[a.id].r}">${art(a.id)}</span><span class="anm"><b class="nt">${C[a.id].n}</b><small>${live?(needT(SK[a.id][bt.sel])?'แตะศัตรูเพื่อใช้ ':'')+`<i class="nt">${SK[a.id][bt.sel][0]}</i>`:S.auto?'ออโต้':'รอ…'}</small></span>
         ${[0,1,2].map(k=>skBtn(a.id,k,{attr:`data-act="sk" data-k="${k}" ${live&&a.cds[k]===0?'':'disabled'}`,cls:(live&&bt.sel===k?'pick ':'')+(a.cds[k]?'off':''),cd:a.cds[k]?a.cds[k]:''})).join('')}</div>`})()}
    </div></div>`);
  if(ret){const e=$(ret.id);if(e&&!RM)e.animate([{transform:`translate(${ret.dx}px,${ret.dy}px) scale(1.12)`},{transform:'none'}],{duration:230/(S.spd||1),easing:'ease-out'});ret=null}
  if(hits.size)sfx('hit');
  hits.forEach(id=>{const e=$(id);if(!e)return;const b=document.createElement('span');b.className='imp';e.append(b);setTimeout(()=>b.remove(),380);
    if(!RM)e.animate([{filter:'brightness(3.5)',transform:'translateX(8px)'},{transform:'translateX(-7px)'},{filter:'none',transform:'translateX(4px)'},{transform:'none'}],{duration:280})});hits.clear();
  if(quake){quake=false;if(!RM)$('view').animate([{transform:'translate(7px,-5px)'},{transform:'translate(-7px,5px)'},{transform:'translate(5px,4px)'},{transform:'none'}],{duration:320})}
}
// damage goes through the shield first; a critical hit multiplies it by the attacker's crit damage
let hitM=false; // is the current attacker a magic user
function hurt(list,pre,i,d,cls='d',cr){const t=list[i],k=d<0?'g':(hitM?'m':'p')+(cr?'c':'');
  if(d>0&&t.sh>0){const ab=Math.min(t.sh,d);t.sh-=ab;d-=ab;if(d<=0){q(pre+i,'🛡 -'+ab,'s');hits.add(pre+i);return}}
  t.hp-=d;q(pre+i,(d<0?'+':'-')+Math.abs(d)+(cr?'!':''),k);if(d>0)hits.add(pre+i)}
function mend(j,amt){const x=bt.al[j],h=Math.min(Math.round(amt),x.max-x.hp);if(h>0)hurt(bt.al,'a',j,-h,'g')}
function ward(j,amt){const x=bt.al[j],v=Math.min(x.max,Math.round((x.sh||0)+amt))-(x.sh||0);x.sh=(x.sh||0)+v;q('a'+j,'🛡 +'+v,'s')}
const roll=(a,v,sure)=>{const cr=sure||Math.random()<a.crit;return[Math.round(a.atk*v*(cr?a.cx:1)),cr]};
const pump=(x,j,v)=>{const n=Math.min(x.base*2,Math.round(x.atk*v));if(n>x.atk){x.atk=n;q('a'+j,'ATK ↑','g')}};
function cast(a,k,ti){
  const sk=SK[a.id][k],[name,,type,v]=sk,ai=bt.al.indexOf(a),t=bt.en[ti];hitM=!!C[a.id].m;bt.log=`${C[a.id].n} ใช้ ${name}`;
  if(needT(sk)){
    const [d,cr]=roll(a,v*(type==='exec'&&t.hp<=t.max/2?2:1),type==='sure');hurt(bt.en,'e',ti,d,'d',cr);
    if(type==='drain')mend(ai,d/2)}
  else if(type==='aoe')bt.en.forEach((e,j)=>{if(e.hp>0){const [d,cr]=roll(a,v);hurt(bt.en,'e',j,d,'d',cr)}});
  else if(type==='heal'){let b=-1;bt.al.forEach((x,j)=>{if(x.hp>0&&(b<0||x.hp/x.max<bt.al[b].hp/bt.al[b].max))b=j});mend(b,a.atk*v*a.hb)}
  else if(type==='healall')bt.al.forEach((x,j)=>{if(x.hp>0)mend(j,a.atk*v*a.hb)});
  else if(type==='guard'){ward(ai,a.max*v*a.hb);a.taunt=true}
  else if(type==='shieldall')bt.al.forEach((x,j)=>{if(x.hp>0)ward(j,a.max*v*a.hb)});
  else if(type==='buff')pump(a,ai,v);
  else if(type==='rally')bt.al.forEach((x,j)=>{if(x.hp>0)pump(x,j,v)});
  a.cds=a.cds.map((c,j)=>j===k?CD[k]:Math.max(0,c-1));
}
// an enemy hits whoever is taunting, otherwise a random fighter
function foePick(){const live=bt.al.map((x,j)=>j).filter(j=>bt.al[j].hp>0);if(!live.length)return -1;const tn=live.filter(j=>bt.al[j].taunt);return tn.length?tn[0]:live[Math.floor(Math.random()*live.length)]}
function foeHit(e,j){hitM=!!C[e.id].m;const [d,cr]=roll(e,1);hurt(bt.al,'a',j,Math.round(d*(bt.al[j].taunt?.6:1)),'d',cr)}
async function act(ti){
  const my=bt;if(busy||!my)return;const a=actor();if(!a)return;const k=a.cds[my.sel]?0:my.sel,sk=SK[a.id][k],ai=my.al.indexOf(a);
  if(needT(sk)&&(ti<0||!my.en[ti]||my.en[ti].hp<=0))return;
  busy=true;my.log=`${C[a.id].n} ใช้ ${sk[0]}`;draw();
  if(k>0){await cutin(a,k);if(bt!==my)return}
  if(isAtk(sk))await strike('a'+ai,a.id,needT(sk)?['e'+ti]:my.en.map((e,j)=>e.hp>0?'e'+j:null).filter(Boolean),1);
  else await pose('a'+ai,['healall','shieldall','rally'].includes(sk[2])?my.al.map((x,j)=>x.hp>0?'a'+j:null).filter(Boolean):['a'+ai]);
  if(bt!==my)return;const big=quake;
  cast(a,k,ti);a.done=true;my.sel=0;quake=big||k===2;draw();await W(540);if(bt!==my)return;
  if(my.en.every(e=>e.hp<=0))return finish(true);
  if(!actor()){
    for(let i=0;i<my.en.length;i++){const e=my.en[i];if(e.hp<=0)continue;
      const j=foePick();if(j<0)break;my.log=`${C[e.id].n} โจมตี ${C[my.al[j].id].n}`;draw();
      await strike('e'+i,e.id,['a'+j],-1);if(bt!==my)return;foeHit(e,j);draw();await W(440);if(bt!==my)return}
    if(my.al.every(x=>x.hp<=0))return finish(false);
    my.round++;my.al.forEach(x=>{x.done=false;x.taunt=false});
  }
  busy=false;if(!S.auto)my.log='เลือกสกิล แล้วแตะศัตรู';draw();if(S.auto)autoAct();
}
async function finish(won){
  const my=bt;busy=true;sfx(won?'win':'lose');await banner(won?'FINISH':'DEFEAT',won?'':'lose');if(bt!==my)return;
  const n=bt.n,team=bt.al.map(a=>a.id);bt=null;busy=false;let rows='',g=0,drop=null,jp=false,bb=0;
  if(won){const rg=rollGold(n);g=rg.g;jp=rg.jp;bb=bossBonus(n);S.gold+=g+bb;qAdd('win');if(n%10===0)qAdd('boss');if(Math.random()<(n%10===0?DROP_BOSS:DROP)){drop=amRoll();S.am=S.am||{};S.am[drop]=(S.am[drop]||0)+1}const x=expOf(n);
    rows=team.map(id=>{const was=S.cards[id].lv,wasMax=maxed(id),up=addExp(id,x),c=S.cards[id];
      return `<div class="mini r-${C[id].r} glow ${fr(id)}">${fxh(id)}${rib(id)}<div class="art"><img src="${artSrc(id)}" alt=""></div></div><div><b>${C[id].n}</b> ${wasMax?'<span class="gold">Lv MAX</span>':'Exp +'+x} ${up?`<span class="gold">Lv ${was} → ${c.lv}</span>`:`· Lv ${c.lv}`}<div class="hp xp"><i style="width:${maxed(id)?100:c.exp/need(c.lv)*100}%"></i></div></div>`}).join('');
    if(n>S.cleared)S.cleared=n;save()}
  const next=Math.min(MAXST,n+1);
  view(`<div class="cols"><div class="rail">
    <h1>${won?'ชนะ!':'แพ้'}</h1><p class="num">ด่าน ${n}</p>
    ${won?`<p class="num gold">Gold +${g}${jp?' <b class="nt">JACKPOT x4</b>':''}</p>${bb?`<p class="num gold">โบนัสชนะบอสครั้งแรก +${bb}</p>`:''}${drop?`<div class="row"><span style="width:38px">${amu(drop)}</span><span>ได้เครื่องราง<br><b>${AM[drop].n}</b></span></div>`:''}`:'<p class="sub">ลองเก็บเลเวลจากด่านก่อนหน้า หรือเปิดแพ็คหาการ์ดใหม่</p>'}
    ${won&&n<MAXST?`<button class="btn go" data-act="go" data-n="${next}">ด่าน ${next}</button>`:''}
    <button class="btn ${won?'alt':'go'}" data-act="go" data-n="${n}">เล่นด่านนี้อีก</button>
    <button class="btn alt sm" data-act="home">หน้าหลัก</button>
  </div><div class="main">${won?`<div class="res">${rows}</div>`:''}</div></div>`);
}

function sfx(kind){if(!S||S.sfx===false)return;try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const A=actx,t=A.currentTime;
  const tone=(type,f0,f1,d,v,at=0)=>{const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.setValueAtTime(f0,t+at);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+at+d);g.gain.setValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.001,t+at+d);o.connect(g).connect(A.destination);o.start(t+at);o.stop(t+at+d+.02)};
  const noise=(d,v,ft,f0,f1,at=0)=>{const n=A.sampleRate*d|0,b=A.createBuffer(1,n,A.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const src=A.createBufferSource(),fl=A.createBiquadFilter(),g=A.createGain();src.buffer=b;fl.type=ft;fl.frequency.setValueAtTime(f0,t+at);fl.frequency.exponentialRampToValueAtTime(f1,t+at+d);g.gain.setValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.001,t+at+d);src.connect(fl).connect(g).connect(A.destination);src.start(t+at)};
  if(kind==='slash'){noise(.16,.22,'bandpass',5200,900);tone('sawtooth',900,200,.1,.04)}
  else if(kind==='smash'){noise(.28,.35,'lowpass',900,90);tone('sine',140,38,.3,.35)}
  else if(kind==='arrow'){noise(.2,.15,'highpass',1800,6500);tone('triangle',520,180,.07,.12)}
  else if(kind==='magic'){tone('square',380,1500,.22,.06);tone('sine',760,2600,.26,.06,.03);noise(.22,.06,'bandpass',2400,5200,.04)}
  else if(kind==='hit'){noise(.09,.3,'lowpass',2400,300);tone('square',210,70,.1,.1)}
  else if(kind==='heal'){[523,659,784,1047].forEach((f,i)=>tone('sine',f,f,.2,.08,i*.07))}
  else if(kind==='ult'){tone('sawtooth',110,880,.5,.07);noise(.5,.08,'bandpass',300,4200)}
  else if(kind==='win'){[523,659,784,1047,1319].forEach((f,i)=>tone('square',f,f,.16,.07,i*.11))}
  else if(kind==='lose'){[392,330,262,196].forEach((f,i)=>tone('triangle',f,f*.97,.28,.1,i*.2))}
  else if(kind==='start'){tone('square',440,440,.09,.07);tone('square',660,660,.14,.07,.1)}
}catch(e){}}

const BUILD='b76';const FBV='10.14.1';let fbP=null,cloudT=0,cloudDirty=false;
function fbLoad(){if(!FB_CFG)return Promise.reject(new Error('no config'));
  return fbP=fbP||['app','auth','firestore','database'].reduce((pr,m)=>pr.then(()=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=`https://www.gstatic.com/firebasejs/${FBV}/firebase-${m}-compat.js`;sc.onload=ok;sc.onerror=()=>no(new Error('sdk'));document.head.append(sc)})),Promise.resolve()).then(()=>{if(!firebase.apps.length)firebase.initializeApp(FB_CFG);return firebase})}
const fbUser=()=>new Promise(ok=>{const off=firebase.auth().onAuthStateChanged(u=>{off();ok(u)})});
const saveDoc=()=>firebase.firestore().collection('saves').doc(USER.sub);
// take whichever save is newer, the one on this device or the one in the cloud
function cloudPull(){if(!FB_CFG||!USER||!USER.sub)return Promise.resolve();
  return fbLoad().then(fbUser).then(u=>{if(!u||u.uid!==USER.sub){USER=null;try{localStorage.removeItem(SESSION)}catch(e){}throw new Error('signed-out')}return saveDoc().get()})
   .then(d=>{if(d.exists){try{const c=JSON.parse(d.data().data);if(c&&c.cards&&(c.ts||0)>(S.ts||0)){const lang=S.lang;S=unlock(c);if(lang)S.lang=lang;try{localStorage.setItem(saveKey(),JSON.stringify(S))}catch(e){}}}catch(e){}}else cloudDirty=true;if(cloudDirty)cloudFlush()})}
function cloudPush(){if(!FB_CFG||!USER||!USER.sub)return;cloudDirty=true;clearTimeout(cloudT);cloudT=setTimeout(cloudFlush,2500)}
function cloudFlush(){clearTimeout(cloudT);if(!cloudDirty||!FB_CFG||!USER||!USER.sub||!window.firebase||!firebase.apps.length||!firebase.auth().currentUser)return;cloudDirty=false;
  saveDoc().set({data:JSON.stringify(S),ts:S.ts||0,name:S.me?S.me.name:'',cleared:S.cleared||0,at:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{cloudDirty=true})}
addEventListener('visibilitychange',()=>{if(document.hidden)cloudFlush()});
function gLogin(){const b=$('gbtn'),m=$('gmsg'),say=t=>{if(m)m.textContent=t+' '};if(b)b.disabled=true;say(S.lang==='en'?'Connecting…':'กำลังเชื่อมต่อ…');
  fbLoad().then(()=>firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())).then(r=>{const u=r.user;signIn({sub:u.uid,name:(u.displayName||'Player').split(' ')[0],email:u.email,pic:u.photoURL})})
   .catch(e=>{if(b)b.disabled=false;say((S.lang==='en'?'Sign-in failed: ':'ล็อกอินไม่สำเร็จ: ')+(e&&e.code||e&&e.message||''))})}
function signIn(u){const lang=S&&S.lang;USER=u;try{localStorage.setItem(SESSION,JSON.stringify(u))}catch(e){}
  S=load();if(lang)S.lang=lang;const fin=()=>{ensureMe();if(u.sub&&u.name&&S.me.name==='ผู้เล่น')S.me.name=u.name.slice(0,12);save()};
  if(u.sub){loading(cloudPull().then(fin,fin))}else{fin();loading()}}
function welcome(){
  view(`<div class="loadv" style="--bg:url(${COVER_BG})"><div class="cbg"></div>
   <h2 style="font-size:24px">ยินดีต้อนรับ</h2><p>${S.mig!=null?'อัปเดตใหญ่: ตัวละครชุดใหม่ทั้งหมด เริ่มด่าน 1 ใหม่ · Gold เพชร และเครื่องรางยังอยู่ครบ'+(S.mig?` · <b class="nt gold">+${S.mig.toLocaleString('en')} Gold</b> ชดเชยการ์ดชุดเก่า`:'')+'<br>':''}ของขวัญล็อกอิน: การ์ดเริ่มต้น 3 ใบ</p>
   <div class="gift">${GIFT.map(id=>`<div>${full(id,'','glow').replace('<button','<span').replace('</button>','</span>')}</div>`).join('')}</div>
   <button class="btn go" data-act="claim">รับการ์ด</button></div>`)}
const TIPS=['การ์ดได้ Exp เฉพาะใบที่อยู่ในทีมตอนชนะ','ด่านบอสทุก 10 ด่าน ดรอป Gold ทุกครั้ง และมีโอกาสได้เครื่องรางสูงกว่า','การ์ดแต่ละระดับมีเลเวลสูงสุดไม่เท่ากัน','ดู Lv แนะนำในหน้าเลือกด่านก่อนเข้าสู้','การเทรดคือการให้ของ ต้องยืนยันว่าเป็นผู้ส่งหรือผู้รับทุกครั้ง'];
// loading screen: really preloads every card, fighter and the next map so nothing pops in during play
function loading(wait){
  const next=Math.min(MAXST,S.cleared+1),list=[COVER_BG,mapImg(next),...Object.keys(C).flatMap(id=>[img(id),`spr/${id}.webp`])];
  view(`<div class="loadv art" style="--bg:url(${COVER_BG})"><div class="cbg"></div>
   <div class="lbar"><i id="lbi"></i></div><p class="lpct nt" id="lpc">0%</p>
   <p class="ltip">${TIPS[Math.floor(Math.random()*TIPS.length)]}</p></div>`);
  let done=0,fin=false;const t0=performance.now(),total=list.length;
  const go=()=>{if(!$('lbi'))return;if(!USER)return titleScreen();S.gift?home():welcome()};
  const end=()=>{if(fin)return;fin=true;const w=Promise.race([Promise.resolve(wait).catch(()=>{}),new Promise(r=>setTimeout(r,9000))]);w.then(()=>setTimeout(go,Math.max(250,1400-(performance.now()-t0))))};
  const tick=()=>{done++;const b=$('lbi'),p=$('lpc'),v=Math.round(done/total*100);if(b)b.style.width=v+'%';if(p)p.textContent=v+'%';if(done>=total)end()};
  let k=0;const pump=()=>{if(k>=total)return;const im=new Image();im.onload=im.onerror=()=>{tick();pump()};im.src=list[k++]};
  for(let i=0;i<6;i++)pump();setTimeout(()=>{const b=$('lbi');if(b)b.style.width='100%';end()},12000);
}
// UI size: the stage is laid out smaller or larger than the screen and scaled back to fill it, so every screen grows or shrinks together (kept per device)
const uiK=()=>{let k=1;try{k=+localStorage.getItem('pdb_ui')||1}catch(e){}return Math.max(.8,Math.min(1.3,k))};
function fit(){const w=innerWidth,h=innerHeight,p=h>w,s=$('stage'),k=uiK();s.style.width=(p?h:w)/k+'px';s.style.height=(p?w:h)/k+'px';s.style.setProperty('--H',(p?w:h)/k+'px');s.style.transform=(p?`rotate(90deg) translateY(${-w}px) `:'')+(k===1?'':`scale(${k})`)||'none'}
fit();addEventListener('resize',fit);
// real landscape: go fullscreen and lock the device to landscape so the phone's own keyboard comes up sideways too (Android browsers; elsewhere it fails quietly and the upright text box below is used)
let fsTried=false;const fsPref=()=>{try{return localStorage.getItem('pdb_fs')!=='0'}catch(e){return true}};
function goLandscape(){const d=document.documentElement;if(document.fullscreenElement||!d.requestFullscreen)return Promise.resolve(false);
  return d.requestFullscreen({navigationUI:'hide'}).then(()=>screen.orientation&&screen.orientation.lock?screen.orientation.lock('landscape').then(()=>true,()=>false):false,()=>false).then(ok=>{setTimeout(fit,150);setTimeout(fit,500);return ok})}
// every tap re-enters fullscreen while the setting is on (a Google sign-in popup or the back gesture drops out of it), so the browser's address bar stays hidden
const fsWant=e=>{if(!fsPref()||document.fullscreenElement||matchMedia('(display-mode:fullscreen),(display-mode:standalone)').matches)return;if(e.target&&e.target.closest&&e.target.closest('[data-act=glogin],[data-act=fstog]'))return;fsTried=true;goLandscape()};
addEventListener('pointerup',fsWant,true);addEventListener('click',fsWant,true);
document.addEventListener('fullscreenchange',()=>{setTimeout(fit,150)});if(screen.orientation)screen.orientation.addEventListener('change',()=>setTimeout(fit,150));
document.addEventListener('focusin',ev=>{const n=ev.target,chat=n.id==='chi';if((n.id!=='nm'&&!chat)||innerHeight<=innerWidth||$('kb'))return;n.blur();
  const en=S.lang==='en',lab=chat?(en?'Chat (up to 40 characters)':'แชท (ไม่เกิน 40 ตัวอักษร)'):(en?'Name (up to 12 characters)':'ชื่อ (ไม่เกิน 12 ตัวอักษร)'),max=chat?40:12;
  const k=document.createElement('div');k.id='kb';k.innerHTML=`<label for="kbi">${lab}</label><input id="kbi" maxlength="${max}" autocomplete="off" enterkeyhint="${chat?'send':'done'}"><div class="row"><button class="btn go" id="kbo">${chat?(en?'Send':'ส่ง'):(en?'OK':'ตกลง')}</button><button class="btn alt" id="kbc">${en?'Cancel':'ยกเลิก'}</button></div>`;
  document.body.append(k);const i=$('kbi');i.value=n.value;const done=ok=>{if(ok){if(chat)chatSend(i.value);else n.value=i.value.slice(0,12)}k.remove()};
  $('kbo').onclick=()=>done(true);$('kbc').onclick=()=>done(false);i.onkeydown=e=>{if(e.key==='Enter')done(true)};setTimeout(()=>i.focus(),30)});
S=load();try{const l=localStorage.getItem('pdb_lang');if(l&&!USER)S.lang=l}catch(e){}document.documentElement.lang=S.lang||'th';USER?loading(USER.sub?cloudPull().catch(()=>{}):null):titleScreen();
</script>
