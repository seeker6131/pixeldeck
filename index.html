<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c1030">
</head>
<body>
<title>Pixeldeck Battle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: a landscape stage — a narrow status rail on the left, the working area (board, cards, shop) on the right. */
:root{
  color-scheme:dark;
  --night:#1d2b53; --panel:#2a3a6e; --deep:#121a36; --ink:#fff1e8; --dim:#c2c3c7;
  --red:#ff004d; --yellow:#ffec27; --green:#00e436; --blue:#29adff; --orange:#ffa300; --plum:#7e2553; --lav:#83769c;
  --st:#b08a5a; --c:#a9adb8; --uc:#3ddc5a; --r:#4aa8ff; --l:#ffd23a; --sl:#ff9d1a;
  --display:"Pixelify Sans","Chakra Petch",system-ui,sans-serif;
  --body:"Chakra Petch","Pixelify Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4}
/* the game is always a landscape stage; on an upright phone the stage is turned 90 degrees */
#stage{position:fixed;left:0;top:0;transform-origin:top left;padding-block:10px;padding-inline:16px;overflow:hidden}
#view{height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1{font-family:var(--display);font-size:30px;line-height:1;margin:0;color:var(--yellow);text-shadow:3px 3px 0 var(--red)}
h2{font-family:var(--display);font-size:20px;line-height:1.1;margin:0;color:var(--yellow)}
p{margin:0}
.px{border:3px solid var(--deep);background:var(--panel);box-shadow:0 4px 0 var(--deep)}
.btn{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2;padding:7px 12px;border:3px solid var(--deep);background:var(--yellow);color:var(--deep);box-shadow:0 4px 0 var(--deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.btn.alt{background:var(--panel);color:var(--ink)}
.btn.go{background:var(--red);color:var(--ink)}
.btn.sm{font-size:14px;padding:4px 8px}
.btn.on{background:var(--green);color:var(--deep)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;height:100%}
.rail{display:grid;gap:7px;align-content:start;min-height:0;overflow-y:auto;padding-bottom:6px}
.main{min-height:0;overflow-y:auto;padding:18px 20px}
.num{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.gold{color:var(--yellow)}.dia{color:var(--blue)}
.sub{font-size:12px;color:var(--dim)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:grid;gap:2px;text-align:left;padding:10px 12px;font-family:var(--display);font-size:20px;font-weight:700}
.tile span{font-family:var(--body);font-size:12px;font-weight:500;color:var(--dim)}
/* rarity: each tier sets --gl; the frame glow is drawn from it */
.r-ST{--gl:var(--st)}.r-C{--gl:var(--c)}.r-UC{--gl:var(--uc)}.r-R{--gl:var(--r)}.r-L{--gl:var(--l)}.r-SL{--gl:var(--sl)}
.glow{--ln:color-mix(in srgb,var(--gl) 45%,#fff);box-shadow:0 0 0 2px var(--ln),0 0 7px 3px var(--gl),0 0 18px 6px color-mix(in srgb,var(--gl) 70%,transparent),0 0 34px 10px color-mix(in srgb,var(--gl) 30%,transparent)}
.r-C.glow{box-shadow:0 0 0 2px var(--c)}
/* Rare and above move: the halo breathes and stars twinkle on the frame */
.r-R.glow{animation:pulse 1.6s ease-in-out infinite alternate}
.r-L.glow{--gb:30px;--gs:10px;animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 2px var(--ln),0 0 5px 2px var(--gl),0 0 12px 4px color-mix(in srgb,var(--gl) 55%,transparent),0 0 22px 6px color-mix(in srgb,var(--gl) 20%,transparent)}
  to{box-shadow:0 0 0 2px var(--ln),0 0 10px 4px var(--gl),0 0 var(--gb,24px) var(--gs,8px) color-mix(in srgb,var(--gl) 80%,transparent),0 0 calc(var(--gb,24px)*1.8) calc(var(--gs,8px)*1.6) color-mix(in srgb,var(--gl) 38%,transparent)}}
.sp{position:absolute;z-index:3;width:17%;aspect-ratio:1;background:#fff;pointer-events:none;clip-path:polygon(50% 0,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0 50%,43% 43%);transform:translate(-50%,-50%) scale(0);animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,60%,100%{transform:translate(-50%,-50%) scale(0)}80%{transform:translate(-50%,-50%) scale(1)}}
/* fire frame: a pixel fire simulation drawn on a canvas that sits behind the card and overhangs every edge */
.fire{isolation:isolate}
.firec{position:absolute;z-index:-1;left:-17.5%;top:-13.7%;width:135%;height:127.4%;image-rendering:pixelated;pointer-events:none}
.fire.glow{animation:none;box-shadow:0 0 0 2px #ffec27,0 0 26px 10px rgba(255,90,0,.55)}
/* rarity banner drawn over the caption strip of the card art */
.cnm{position:absolute;left:6.5%;right:6.5%;top:4.2%;height:10.4%;display:grid;place-items:center;background:#000;color:#fff;font-family:var(--display);font-weight:700;font-size:7.6cqw;letter-spacing:.04em;line-height:1;white-space:nowrap;text-transform:uppercase;overflow:hidden}
.chp{position:absolute;top:15.8%;height:8.2%;min-width:27%;padding:0 2cqw;display:grid;place-items:center;background:rgba(8,10,24,.96);color:#fff;font-family:var(--display);font-weight:700;font-size:5.2cqw;line-height:1;white-space:nowrap}
.chp.l{left:8.3%}.chp.r{right:8.3%;color:var(--gl)}
.ban{position:absolute;left:8.3%;right:8.3%;top:66.2%;height:8.4%;display:grid;place-items:center;background:#000;color:var(--gl);font-family:var(--display);font-weight:700;font-size:6.2cqw;letter-spacing:.08em;line-height:1;white-space:nowrap}
.pan{position:absolute;left:7.4%;right:7.4%;top:75.2%;height:19%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.6cqw;padding:0 2cqw;
  background:linear-gradient(#3a2a5c,#1a1230);box-shadow:inset 0 0 0 .8cqw #0a0e22,inset 0 0 0 1.5cqw #d9a441;font-family:var(--display);font-weight:700;line-height:1}
.sb{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:.6cqw 1.2cqw;padding:1.6cqw 1.8cqw 1.3cqw;background:#0a0e22;box-shadow:inset 0 0 0 .5cqw var(--sc);min-width:0}
.sb.a{--sc:#ff7a4d}.sb.m{--sc:#c98bff}.sb.d{--sc:#5cb8ff}
.sb img{width:5.6cqw;height:5.6cqw;max-width:none;image-rendering:pixelated}
.sb b{font-size:5.2cqw;letter-spacing:.06em;color:var(--sc);text-align:left;white-space:nowrap}
.sb i{grid-column:1/-1;font-style:normal;font-size:10.6cqw;color:#fff;text-align:center;font-variant-numeric:tabular-nums;text-shadow:.6cqw .6cqw 0 #000}
.amslot{display:grid;place-items:center;width:13.5cqw;height:13.5cqw;border-radius:50%;border:.7cqw dashed #d9a441;color:#d9a441;font-size:8cqw;line-height:1}
.amslot.has{border:0}
/* amulets: a round charm in the amulet's colour */
.amu{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 35%,#4a59a8,#161c44 75%);box-shadow:inset 0 0 0 2px var(--k1),0 0 0 2px #0a0e22,0 0 0 4px #d9a441,0 0 0 6px #0a0e22}
.amslot .amu{width:12.2cqw;height:12.2cqw;aspect-ratio:auto;box-shadow:inset 0 0 0 .5cqw var(--k1),0 0 0 .6cqw #0a0e22,0 0 0 1.3cqw #d9a441}
.amu img{width:80%;image-rendering:pixelated}
.amlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin-bottom:18px}
.amrow{display:grid;grid-template-columns:44px 1fr;gap:4px 14px;align-items:center;text-align:left;padding:10px 12px 10px 14px;border:3px solid var(--deep);background:var(--panel);color:var(--ink)}
.mkpick{position:relative;width:40px;margin:7px 8px;padding:0;border:0;background:none;color:var(--ink)}.mkpick small{display:block;text-align:center;font-size:11px;margin-top:5px}.mkpick.on{outline:3px solid var(--yellow);outline-offset:5px}
/* trade room: a walkable plaza; avatars are sorted by depth and tapped to open the trade menu */
.troom{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:4px;padding:5px 10px 8px}
.tfloor{position:relative;overflow:hidden;border:3px solid var(--deep);background:#35603f}
/* the plaza is wider than the screen; the camera slides it so the player stays near the middle */
.tworld{position:absolute;left:0;top:0;height:100%;cursor:pointer;background:
  linear-gradient(90deg,transparent 0 0),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 56px),repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 2px,transparent 2px 56px),
  linear-gradient(#6b5a48 0 40px,#3d6b4a 40px)}
.tworld::before{content:"";position:absolute;left:0;right:0;top:54%;height:34px;background:repeating-linear-gradient(90deg,#c9b48a 0 28px,#bda67a 28px 56px);box-shadow:0 0 0 3px rgba(0,0,0,.25);pointer-events:none}
.tworld .deco{position:absolute;pointer-events:none}
.stall{width:74px;height:46px;background:linear-gradient(#b5793f 0 30%,#7a4a22 30%);box-shadow:0 0 0 3px #0a0e22}
.stall::before{content:"";position:absolute;left:-6px;right:-6px;top:-20px;height:22px;background:repeating-linear-gradient(90deg,var(--aw,#ff004d) 0 12px,#fff1e8 12px 24px);box-shadow:0 0 0 3px #0a0e22}
.fount{width:64px;height:64px;border-radius:50%;background:radial-gradient(#bfe9ff 0 30%,#29adff 32% 58%,#c2c3c7 60%);box-shadow:0 0 0 3px #0a0e22}
.tree{width:44px;height:44px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 30%,#5fbf5a,#1f6b34);box-shadow:0 0 0 3px #0a0e22;transform-origin:50% 100%;animation:idle 2.4s ease-in-out infinite alternate}
.tree::after{content:"";position:absolute;left:17px;top:42px;width:10px;height:14px;background:#7a4a22;box-shadow:0 0 0 3px #0a0e22;z-index:-1}
.lamp{width:8px;height:44px;background:#3b3b46;box-shadow:0 0 0 2px #0a0e22}
.lamp::before{content:"";position:absolute;left:-6px;top:-14px;width:20px;height:16px;background:#ffec27;box-shadow:0 0 0 2px #0a0e22,0 0 18px 8px rgba(255,236,39,.45);animation:glowp 1.6s ease-in-out infinite alternate}
/* character sprites: one sheet, a row per character, three columns (stand, step, step) */
.chs{display:block;width:56px;height:52px;background:url(chars.png) 0 0/168px 2600px;image-rendering:pixelated}
.av{position:absolute;width:56px;margin:-56px 0 0 -28px;padding:0;border:0;background:none;color:#fff;display:grid;justify-items:center}
.av .chs{filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.av span{font-size:10px;line-height:1.3;padding:0 4px;background:rgba(10,14,34,.8);white-space:nowrap;margin-top:1px}
.av.me{pointer-events:none}.av.me span{color:var(--yellow)}
.av.flip .chs{transform:scaleX(-1)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.roomb{display:grid;gap:4px;text-align:left;padding:10px 12px;color:var(--ink);font-family:var(--display);font-size:20px;font-weight:700}
.roomb small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--dim)}
.roomb .bar2{height:8px;background:#000}.roomb .bar2 i{display:block;height:100%;background:var(--green)}
.roomb:disabled{opacity:.5}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:12px}
.chb{display:grid;justify-items:center;gap:2px;padding:6px 2px 4px;border:3px solid var(--deep);background:var(--panel);color:var(--ink);font-size:10px;line-height:1.2;text-align:center}
.chb.on{outline:3px solid var(--yellow);outline-offset:1px}
#tui{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:9999}
.tmenu{pointer-events:auto;display:grid;gap:6px;max-height:98%;overflow:auto;min-width:230px;max-width:86%;padding:12px 14px;background:var(--panel);border:3px solid var(--deep);box-shadow:0 5px 0 var(--deep)}
.tmenu .pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tmenu .mkpick{margin:6px 8px;width:32px}
.looks{display:flex;gap:14px;flex-wrap:wrap;padding:4px}
.swb{width:34px;height:34px;padding:0;border:3px solid var(--deep);box-shadow:0 3px 0 var(--deep)}.swb.on{outline:3px solid var(--yellow);outline-offset:3px}
.avbig{width:84px;height:112px;image-rendering:pixelated;justify-self:center;background:var(--panel);border:3px solid var(--deep)}
.prof{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:6px 8px;text-align:left;color:var(--ink)}
.prof .chs{grid-row:1/3}.prof b{font-size:15px;overflow-wrap:anywhere}.prof small{font-size:12px;color:var(--yellow)}
.lookb{padding:4px;border:3px solid var(--deep);background:var(--panel)}.lookb.on{outline:3px solid var(--yellow)}
.lookb img{display:block;width:42px;height:56px;image-rendering:pixelated}
#nm{font:inherit;font-size:16px;padding:6px 8px;border:3px solid var(--deep);background:#fff1e8;color:#121a36;width:100%}
.amrow.on{outline:3px solid var(--yellow);outline-offset:1px}
.amrow b{font-size:14px}.amrow small{display:block;font-size:12px;color:var(--dim);line-height:1.35}
.rib{display:block;font-family:var(--display);font-weight:700;font-size:11px;line-height:1.35;text-align:center;background:var(--gl);color:var(--deep);letter-spacing:.04em}
/* crops the picture window out of a full card image */
.art{position:relative;aspect-ratio:1.3;overflow:hidden;background:var(--deep);width:100%}
.art img{position:absolute;width:138%;max-width:none;left:-19%;top:-50.5%}
.art .nm{position:absolute;left:0;right:0;bottom:0;font-size:10px;line-height:1.3;text-align:center;background:rgba(18,26,54,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{position:relative;display:block;padding:0;border:0;background:var(--deep);color:var(--ink);text-align:center;min-width:0;width:100%}
.st{display:flex;justify-content:space-between;gap:2px;padding:0 4px;font-family:var(--display);font-size:12px;line-height:1.5;font-variant-numeric:tabular-nums}
.mini .st{background:var(--deep)}
.st .a{color:var(--orange)}.st .d{color:var(--blue)}
.hp{height:7px;background:#000}
.hp i{display:block;height:100%;background:var(--green);transition:width .2s steps(5)}
.xp i{background:var(--blue)}
.tag{display:inline-block;white-space:nowrap;font-size:9px;background:var(--plum);padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:24px 22px}
.mini.sel{outline:3px solid var(--yellow);outline-offset:3px}
.grid.big{grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 22px}
.cap{text-align:center;margin-top:8px}
.cf.sel{outline:4px solid var(--yellow);outline-offset:5px}
.cf .ord{top:-10px;right:-10px;z-index:4;min-width:28px;font-size:20px;line-height:1.3;box-shadow:0 0 0 3px var(--deep)}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:5px 4px}
.picks .empty{display:grid;place-items:center;aspect-ratio:.788;border:3px dashed var(--lav);color:var(--lav);font-family:var(--display);font-size:22px}
.picks .sp{display:none}
.tab{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.5;padding:1px 8px;text-align:left;border:3px solid var(--deep);background:var(--gl,var(--panel));color:var(--deep);opacity:.55}
.tab:not([class*="r-"]){color:var(--ink)}.tab.am{background:#d9a441;color:var(--deep)}
.tab.on{opacity:1;outline:3px solid var(--yellow);outline-offset:1px}
.ord{position:absolute;z-index:1;top:14px;right:0;min-width:20px;font-family:var(--display);font-weight:700;background:var(--yellow);color:var(--deep)}
.cf{position:relative;container-type:inline-size;display:block;padding:0;border:0;background:var(--deep);color:var(--ink);text-align:center;min-width:0;width:100%}
.cf img{display:block;width:100%;aspect-ratio:1370/1740}
.cf.lock img{filter:grayscale(1) brightness(.45)}
/* battle: side view, your team stacked on the left, enemies on the right, the middle is the lane attacks cross */
.arena{position:relative;overflow:hidden;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:2px;padding:5px 10px 6px;background:#121a36}
.arena>.atop,.arena>.field{position:relative;z-index:1}
.arena>.atop{background:rgba(10,14,34,.62);margin:-5px -10px 0;padding:4px 10px}
/* stage backdrop: the painting, a swaying copy of its tree line, drifting fog, a moving glow on lava or crystal ground, and a particle canvas */
.bgl{position:absolute;inset:0;background-size:100% 100%;pointer-events:none}
.bgl.lowr{clip-path:inset(25% 0 0 0)}
.bgl.top{clip-path:inset(0 0 74.6% 0);transform-origin:50% 25%;animation:sway 2.8s ease-in-out infinite alternate}
@keyframes sway{from{transform:scaleX(1.04) skewX(-3.2deg)}to{transform:scaleX(1.04) skewX(3.2deg)}}
.bfog{position:absolute;inset:8% -40% 30% -40%;pointer-events:none;opacity:.55;animation:fogm 16s ease-in-out infinite alternate;
  background:radial-gradient(ellipse 22% 42% at 15% 45%,var(--fc,#fff),transparent 70%),radial-gradient(ellipse 26% 36% at 48% 60%,var(--fc,#fff),transparent 70%),radial-gradient(ellipse 20% 44% at 80% 40%,var(--fc,#fff),transparent 70%)}
@keyframes fogm{from{transform:translateX(-18%)}to{transform:translateX(18%)}}
.bglow{position:absolute;inset:24% 0 0 0;pointer-events:none;mix-blend-mode:screen;background:repeating-linear-gradient(105deg,transparent 0 10%,var(--gc) 17%,transparent 25%);background-size:200% 100%;animation:glowm 6s linear infinite,glowp 2.2s ease-in-out infinite alternate}
@keyframes glowm{to{background-position:-200% 0}}
@keyframes glowp{from{opacity:.12}to{opacity:.5}}
.baur{position:absolute;inset:0 0 70% 0;pointer-events:none;mix-blend-mode:screen;opacity:.5;background:linear-gradient(90deg,#3dffb0,#4aa8ff,#b06cff,#3dffb0,#4aa8ff);background-size:300% 100%;-webkit-mask:linear-gradient(#000 30%,transparent);mask:linear-gradient(#000 30%,transparent);animation:glowm 10s linear infinite}
#bgfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated}
.mapth{width:100%;aspect-ratio:2;border:3px solid var(--deep);background-size:cover}
.atop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.alog{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field{position:relative;display:flex;justify-content:space-between;min-height:0}
.team{--cw:min(84px,calc((var(--H) - 96px)/4.15));display:grid;grid-template-rows:repeat(3,1fr);align-items:center;justify-items:end;min-height:0;padding:4px 30px 4px 8px}
.team.en{justify-items:start;padding:4px 8px 4px 30px}
.team>:nth-child(2){margin-right:-26px}.team.en>:nth-child(2){margin-right:0;margin-left:-26px}
.team .mini{width:var(--cw);flex:none}
.team .rib{font-size:9px}.team .st{font-size:11px;padding:0 3px;white-space:nowrap;gap:7px;justify-content:center;background:rgba(10,14,34,.7)}.team .st span{display:flex;align-items:center;gap:2px}.team .st img{width:9px;height:9px;image-rendering:pixelated}.team .art .nm{font-size:8px}.team .mini .stars{bottom:12px}.team .mini .stars svg{width:9px}
/* fighters: the character cut out of its card stands on the floor; rank shows as a glow around the silhouette */
.fig{position:relative;isolation:isolate;display:grid;justify-items:center;gap:1px;width:calc(var(--cw)*1.3);padding:0;border:0;background:none;color:var(--ink);flex:none}
.fig .fhp{width:74%;height:6px;background:#000;box-shadow:0 0 0 1px #0a0e22}.fig .fhp i{display:block;height:100%;background:var(--green);transition:width .2s steps(5)}
.fig .sw{display:block;width:100%;height:calc(var(--cw)*1.02)}.fig .sw.flip{transform:scaleX(-1)}
.fig.boss .sw{height:calc(var(--cw)*1.2)}
/* idle: every fighter breathes and sways from the feet; slime wobbles, flyers hover */
.fig .spr{display:block;width:100%;height:100%;max-width:none;object-fit:contain;object-position:bottom;transform-origin:50% 100%;
  animation:var(--idle,idle) 1.7s ease-in-out infinite alternate,var(--aura,none) .5s steps(3) infinite alternate}
.fig.i-jelly .spr{--idle:jelly;animation-duration:.8s,.5s}.fig.i-hover .spr{--idle:hover}
.slot:nth-child(2) .spr,.team.en>.fig:nth-child(2) .spr{animation-delay:-.6s}.slot:nth-child(3) .spr,.team.en>.fig:nth-child(3) .spr{animation-delay:-1.1s}

{const o=['C','UC','R','L','SL'],b=POOL.slice();POOL.length=0;POOL.push(...Object.keys(C).sort((x,y)=>o.indexOf(C[x].r)-o.indexOf(C[y].r)||b.indexOf(C[x].base||x)-b.indexOf(C[y].base||y)))}

const mid=el=>{const o=off(el);return{x:o.x+el.offsetWidth/2,y:o.y+el.offsetHeight/2}};
function addFx(id,cls){const e=$(id);if(!e)return;const b=document.createElement('span');b.className=cls;e.append(b);setTimeout(()=>b.remove(),520)}
function shoot(from,to,type){const f=$(from),t=$(to);if(!f||!t)return;const A=mid(f),B=mid(t),d=document.createElement('div'),sp=S.spd||1;
  d.className='pj '+type;d.style.left=A.x+'px';d.style.top=A.y+'px';d.innerHTML=`<i style="transform:translate(-50%,-50%) rotate(${Math.atan2(B.y-A.y,B.x-A.x)}rad)"></i>`;$('ov').append(d);
  d.animate([{transform:'translate(0,0)'},{transform:`translate(${B.x-A.x}px,${B.y-A.y}px)`}],{duration:260/sp,easing:'ease-in'}).onfinish=()=>d.remove()}
// one attack: wind up, then either cross the lane and swing, or stay put and fire; resolves at the moment of impact
async function strike(from,id,tos,dir){
  const f=$(from);if(!f||RM)return;const spr=f.querySelector('.spr'),st=STYLE[id]||'slash',sp=S.spd||1,g=(dir===1||f.querySelector('.sw.flip'))?1:-1;
  if(st==='shoot'||st==='cast'){
    spr.animate([{transform:'none'},{transform:`rotate(${-9*g}deg) translateX(${-7*g}px) scale(.97,1.03)`,offset:.45},{transform:`rotate(${7*g}deg) translateX(${9*g}px)`,offset:.6},{transform:'none'}],{duration:520/sp});
    await W(250);sfx(st==='shoot'?'arrow':'magic');tos.forEach(t=>shoot(from,t,PROJ[id]||'fire'));await W(255);return}
  await lunge(from,tos.length===1?tos[0]:null,dir);
  if(st==='smash'){spr.animate([{transform:`translateY(-38px) rotate(${-24*g}deg)`},{transform:`translateY(-44px) rotate(${-30*g}deg)`,offset:.45},{transform:`translateY(6px) rotate(${26*g}deg) scale(1.08,.88)`,offset:.8},{transform:'none'}],{duration:330/sp});
    await W(260);sfx('smash');tos.forEach(t=>addFx(t,'slam'));quake=true}
  else{spr.animate([{transform:`rotate(${-30*g}deg) translateX(${-6*g}px)`},{transform:`rotate(${-34*g}deg) translateX(${-8*g}px)`,offset:.35},{transform:`rotate(${40*g}deg) translateX(${12*g}px)`,offset:.75},{transform:`rotate(${12*g}deg)`}],{duration:260/sp});
    await W(180);sfx('slash');tos.forEach(t=>addFx(t,'arc'+(dir===1?'':' rv')))}
  await W(70)}
async function pose(from,tos){const f=$(from);if(!f||RM)return;
  f.querySelector('.spr').animate([{transform:'none'},{transform:'translateY(-14px) scale(1.06)'},{transform:'none'}],{duration:380/(S.spd||1)});await W(200);sfx('heal');tos.forEach(t=>addFx(t,'aur'));await W(150)} // sprites drawn facing right; mirrored when they fight on the enemy side
function unit(u,el,cls,attr){const p=Math.max(0,u.hp/u.max*100),mon=u.boss!==undefined;
  return `<button class="fig r-${mon?'C':C[u.id].r} ${IDLE[u.id]?'i-'+IDLE[u.id]:''} ${u.boss?'boss':''} ${u.hp<=0?'dead':''} ${cls}" id="${el}" ${attr} title="${C[u.id].n}">${u.boss?'<span class="tagb">BOSS</span>':''}
    <span class="fhp"><i style="width:${p}%"></i></span><span class="sw ${mon&&FACE_R.includes(u.id)?'flip':''}"><img class="spr" src="spr/${u.id}.webp" alt="${C[u.id].n}"></span>
    <div class="st"><span class="a"><img src="${ICON[MAGIC.includes(u.id)?'orb':'sword']}" alt="${atkName(u.id)}">${u.atk}</span><span class="d"><img src="${ICON.shield}" alt="DEF">${Math.max(0,u.hp)}</span></div></button>`}
function draw(){
  const ac=busy?null:actor(),ord=[...bt.al.filter(a=>a.hp>0&&!a.done).map(a=>[a,'al']),...bt.en.filter(e=>e.hp>0).map(e=>[e,'en'])];
  view(`<div class="arena px">${bgLayers(bt.n)}
    <div class="atop"><span class="num">ด่าน ${bt.n} · ${MAPS[mapOf(bt.n)-1]} · รอบ ${bt.round}</span><span class="alog" aria-live="polite">${bt.log}</span>
      <span class="row"><button class="btn sm ${S.auto?'on':'alt'}" data-act="auto">ออโต้</button><button class="btn alt sm" data-act="spd">x${S.spd||1}</button><button class="btn red sm" data-act="prep">ถอย</button></span></div>
    <div class="field">
      <div class="team">${bt.al.map((a,i)=>`<div class="slot"><div class="sks">${[0,1,2].map(k=>{const on=a===ac&&!S.auto&&a.cds[k]===0;
        return skBtn(a.id,k,{attr:`data-act="sk" data-k="${k}" ${on?'':'disabled'}`,cls:(a===ac&&bt.sel===k?'pick ':'')+(a.hp<=0||a.cds[k]?'off':''),cd:a.hp>0&&a.cds[k]?a.cds[k]:''})}).join('')}</div>${unit(a,'a'+i,a===ac?'act':'','disabled')}</div>`).join('')}</div>
      <div class="order">${ord.map(([u,sd],i)=>`<span class="op ${sd} ${i?'':'now'}">${art(u.id)}</span>`).join('')}</div>
      <div class="team en">${bt.en.map((e,i)=>unit(e,'e'+i,'',`data-act="tgt" data-i="${i}" ${busy||e.hp<=0||S.auto?'disabled':''}`)).join('')}</div>
    </div></div>`);
  if(ret){const e=$(ret.id);if(e&&!RM)e.animate([{transform:`translate(${ret.dx}px,${ret.dy}px) scale(1.12)`},{transform:'none'}],{duration:230/(S.spd||1),easing:'ease-out'});ret=null}
  if(hits.size)sfx('hit');
  hits.forEach(id=>{const e=$(id);if(!e)return;const b=document.createElement('span');b.className='imp';e.append(b);setTimeout(()=>b.remove(),380);
    if(!RM)e.animate([{filter:'brightness(3.5)',transform:'translateX(8px)'},{transform:'translateX(-7px)'},{filter:'none',transform:'translateX(4px)'},{transform:'none'}],{duration:280})});hits.clear();
  if(quake){quake=false;if(!RM)$('view').animate([{transform:'translate(7px,-5px)'},{transform:'translate(-7px,5px)'},{transform:'translate(5px,4px)'},{transform:'none'}],{duration:320})}
}
function hurt(list,pre,i,d,cls='d'){const t=list[i];t.hp-=d;q(pre+i,(d<0?'+':'-')+Math.abs(d),cls);if(d>0)hits.add(pre+i)}
function mend(j,amt){const x=bt.al[j],h=Math.min(Math.round(amt),x.max-x.hp);if(h>0)hurt(bt.al,'a',j,-h,'g')}
function cast(a,k,ti){
  const sk=SK[a.id][k],[name,,type,v]=sk,ai=bt.al.indexOf(a),t=bt.en[ti];bt.log=`${C[a.id].n} ใช้ ${name}`;
  if(type==='hit'||type==='exec'||type==='drain'){
    const d=Math.round(a.atk*v*(type==='exec'&&t.hp<=t.max/2?2:1));hurt(bt.en,'e',ti,d);
    if(type==='drain')mend(ai,d/2)}
  else if(type==='aoe')bt.en.forEach((e,j)=>{if(e.hp>0)hurt(bt.en,'e',j,Math.round(a.atk*v))});
  else if(type==='heal'){let b=-1;bt.al.forEach((x,j)=>{if(x.hp>0&&(b<0||x.hp/x.max<bt.al[b].hp/bt.al[b].max))b=j});mend(b,a.atk*v)}
  else if(type==='healall')bt.al.forEach((x,j)=>{if(x.hp>0)mend(j,a.atk*v)});
  else if(type==='guard')mend(ai,a.max*v);
  else if(type==='buff'){a.atk=Math.round(a.atk*v);q('a'+ai,'ATK ↑','g')}
  a.cds=a.cds.map((c,j)=>j===k?CD[k]:Math.max(0,c-1));
}
async function act(ti){
  const my=bt;if(busy||!my)return;const a=actor();if(!a)return;const k=a.cds[my.sel]?0:my.sel,sk=SK[a.id][k],ai=my.al.indexOf(a);
  if(needT(sk)&&(ti<0||!my.en[ti]||my.en[ti].hp<=0))return;
  busy=true;my.log=`${C[a.id].n} ใช้ ${sk[0]}`;draw();
  if(k>0){await cutin(a,k);if(bt!==my)return}
  if(['hit','exec','drain','aoe'].includes(sk[2]))await strike('a'+ai,a.id,needT(sk)?['e'+ti]:my.en.map((e,j)=>e.hp>0?'e'+j:null).filter(Boolean),1);
  else await pose('a'+ai,sk[2]==='healall'?my.al.map((x,j)=>x.hp>0?'a'+j:null).filter(Boolean):['a'+ai]);
  if(bt!==my)return;const big=quake;
  cast(a,k,ti);a.done=true;my.sel=0;quake=big||k===2;draw();await W(540);if(bt!==my)return;
  if(my.en.every(e=>e.hp<=0))return finish(true);
  if(!actor()){
    for(let i=0;i<my.en.length;i++){const e=my.en[i];if(e.hp<=0)continue;
      const live=my.al.map((x,j)=>j).filter(j=>my.al[j].hp>0);if(!live.length)break;
      const j=live[Math.floor(Math.random()*live.length)];my.log=`${C[e.id].n} โจมตี ${C[my.al[j].id].n}`;draw();
      await strike('e'+i,e.id,['a'+j],-1);if(bt!==my)return;hurt(my.al,'a',j,e.atk);draw();await W(440);if(bt!==my)return}
    if(my.al.every(x=>x.hp<=0))return finish(false);
    my.round++;my.al.forEach(x=>x.done=false);
  }
  busy=false;if(!S.auto)my.log='เลือกสกิล แล้วแตะศัตรู';draw();if(S.auto)autoAct();
}
async function finish(won){
  const my=bt;busy=true;sfx(won?'win':'lose');await banner(won?'FINISH':'DEFEAT',won?'':'lose');if(bt!==my)return;
  const n=bt.n,team=bt.al.map(a=>a.id);bt=null;busy=false;let rows='',g=0,drop=null,jp=false,bb=0;
  if(won){const rg=rollGold(n);g=rg.g;jp=rg.jp;bb=bossBonus(n);S.gold+=g+bb;qAdd('win');if(n%10===0)qAdd('boss');if(Math.random()<(n%10===0?DROP_BOSS:DROP)){const ks=Object.keys(AM);drop=ks[Math.floor(Math.random()*ks.length)];S.am=S.am||{};S.am[drop]=(S.am[drop]||0)+1}const x=expOf(n);
    rows=team.map(id=>{const was=S.cards[id].lv,wasMax=maxed(id),up=addExp(id,x),c=S.cards[id];
      return `<div class="mini r-${C[id].r} glow ${fr(id)}">${fxh(id)}${rib(id)}<div class="art"><img src="${img(id)}" alt=""></div></div><div><b>${C[id].n}</b> ${wasMax?'<span class="gold">Lv MAX</span>':'Exp +'+x} ${up?`<span class="gold">Lv ${was} → ${c.lv}</span>`:`· Lv ${c.lv}`}<div class="hp xp"><i style="width:${maxed(id)?100:c.exp/need(c.lv)*100}%"></i></div></div>`}).join('');
    if(n>S.cleared)S.cleared=n;save()}
  const next=Math.min(MAXST,n+1);
  view(`<div class="cols"><div class="rail">
    <h1>${won?'ชนะ!':'แพ้'}</h1><p class="num">ด่าน ${n}</p>
    ${won?`<p class="num gold">Gold +${g}${jp?' <b class="nt">JACKPOT x4</b>':''}</p>${bb?`<p class="num gold">โบนัสชนะบอสครั้งแรก +${bb}</p>`:''}${drop?`<div class="row"><span style="width:38px">${amu(drop)}</span><span>ได้เครื่องราง<br><b>${AM[drop].n}</b></span></div>`:''}`:'<p class="sub">ลองเก็บเลเวลจากด่านก่อนหน้า หรือเปิดแพ็คหาการ์ดใหม่</p>'}
    ${won&&n<MAXST?`<button class="btn go" data-act="go" data-n="${next}">ด่าน ${next}</button>`:''}
    <button class="btn ${won?'alt':'go'}" data-act="go" data-n="${n}">เล่นด่านนี้อีก</button>
    <button class="btn alt sm" data-act="home">หน้าหลัก</button>
  </div><div class="main">${won?`<div class="res">${rows}</div>`:''}</div></div>`);
}

  const t=ev.target.closest('[data-act]');if(!t||t.disabled)return;const a=t.dataset.act,id=t.dataset.id;
  if(a!=='reset')armed=false;
  if(a==='home')home();

  else if(a==='dressdone'){S.me.name=($('nm').value.trim()||'ผู้เล่น').slice(0,12);save();room=null;dressBack==='room'?enterRoom():home()}
  else if(a==='tnpc'){if(room&&room.menu==null){room.target=+t.dataset.i}}
  else if(a==='tclose'){room.menu=null;$('tui').innerHTML=''}

  else if(a==='tok'){const n=room.npcs[room.menu];if(trGive&&spare(trGive)>0&&S.gold>=TRADE_TAX){S.gold-=TRADE_TAX;S.am[trGive]--;const sent=trGive;trGive=null;save();room.menu=null;enterRoom();$('tlog').innerHTML=`ส่งแล้ว: ${AM[sent].n} → <b class="nt">${n.name.replace(/</g,'&lt;')}</b> · จ่ายภาษี ${TRADE_TAX.toLocaleString()} Gold`}}

    else{const c=S.cards[id];if(amSel&&c.am!==amSel){if(spare(amSel)>0)c.am=amSel}else if(c.am)delete c.am;save()}
    coll();const n=document.querySelector('.main');if(n)n.scrollTop=y}
  else if(a==='start'){save();startBattle(prepN)}
  else if(a==='go'){prepN=+t.dataset.n;startBattle(prepN)}
  else if(a==='tgt')act(+t.dataset.i);
  else if(a==='sk'){bt.sel=+t.dataset.k;const ac=actor();if(ac&&!needT(SK[ac.id][bt.sel]))act(-1);else{bt.log=`${SK[ac.id][bt.sel][0]}: แตะศัตรูที่จะโจมตี`;draw()}}
  else if(a==='spd'){S.spd=S.spd===2?1:2;save();if(!busy)draw()}

const FW=108,FH=130,FM=14,fsim=document.createElement('canvas');fsim.width=FW;fsim.height=FH;
const fctx=fsim.getContext('2d'),fimg=fctx.createImageData(FW,FH);let heat=new Float32Array(FW*FH),heat2=new Float32Array(FW*FH),ft=0;

  let k=0;while(k<st.length-2&&t>st[k+1][0])k++;const A=st[k],B=st[k+1],u=(t-A[0])/(B[0]-A[0]);
  return[A[1]+(B[1]-A[1])*u,A[2]+(B[2]-A[2])*u,A[3]+(B[3]-A[3])*u,i<3?0:Math.min(255,(i-2)*70)]});
// the card edge is the fuel line: its heat rolls along the perimeter so tongues grow and shrink; each cell outside
// copies the cell one step nearer the card (leaning upward on the sides) and cools a little, which draws tongues
function fireStep(){
  const x0=FM,x1=FW-FM-1,y0=FM,y1=FH-FM-1,R=Math.random,cl=(v,m)=>v<0?0:v>m?m:v;ft+=.22;
  for(let y=0;y<FH;y++)for(let x=0;x<FW;x++){
    const i=y*FW+x,inX=x>=x0&&x<=x1,inY=y>=y0&&y<=y1;
    if(inX&&inY){
      if(x===x0||x===x1||y===y0||y===y1){const p=(y===y0?x:x===x1?FW+y:y===y1?FW+FH+(FW-x):2*FW+FH+(FH-y));

      else heat2[i]=0;continue}
    const dx=x<x0?1:x>x1?-1:0,dy=y<y0?1:y>y1?-1:0;let sx,sy,dec;
    if(!dx&&dy>0){sx=x+(R()<.34?(R()<.5?-1:1):0);sy=y+1;dec=1.5+R()*2.5}
    else if(dy<0){sx=x+dx+(dx?0:(R()<.3?(R()<.5?-1:1):0));sy=y-1;dec=3.5+R()*4}
    else{sx=x+dx;sy=y+(R()<.62?1:0)+(dy>0&&R()<.5?1:0);dec=1.7+R()*2.6}
    const v=heat[cl(sy,FH-1)*FW+cl(sx,FW-1)]-dec;heat2[i]=v>0?v:0}
  [heat,heat2]=[heat2,heat];
  for(let i=0;i<FW*FH;i++){const c=FPAL[Math.min(36,heat[i]|0)],o=i*4;fimg.data[o]=c[0];fimg.data[o+1]=c[1];fimg.data[o+2]=c[2];fimg.data[o+3]=c[3]}

const EN_RX=[["ผ่านแล้ว (\\d+)/(\\d+) ด่าน · มีการ์ด (\\d+)/(\\d+) ใบ", "Cleared $1/$2 stages · $3/$4 cards"], ["Exp (\\d+) ต่อใบ", "Exp $1 per card"], ["· พัก (\\d+) ตา", "· $1-turn cooldown"], ["ใส่อยู่ (\\d+) · ว่าง (\\d+)", "$1 equipped · $2 spare"], ["เลือก \"(.+?)\" อยู่ แตะการ์ดที่จะใส่", "\"$1\" selected. Tap a card to equip it."], ["ตั้งขาย (.+)$", "List $1"], ["เข้าสู้ \\((\\d)/3\\)", "Fight ($1/3)"], ["เอา (.+?) ออกจากทีม", "Remove $1 from the team"], ["(.+?) ให้$", "$1 gives"], ["^ซื้อ (\\d+) Gold", "Buy for $1 Gold"], ["ใบซ้ำ \\+1 \\(มี (\\d+)\\)", "Copy +1 (have $1)"], ["เปิด (\\d+) Gold", "Open for $1 Gold"], ["เปิด (\\d+) เพชร", "Open for $1 diamonds"], ["(\\d+)/(\\d+) คน", "$1/$2 players"], ["ซ้ำ → Exp", "Duplicate → Exp"]].map(([a,b])=>[new RegExp(a),b]),EN_KEYS=Object.keys(EN).sort((a,b)=>b.length-a.length),THAI=/[\u0e00-\u0e7f]/;
function tr(x){if(!THAI.test(x))return x;for(const [r,b] of EN_RX)x=x.replace(r,b);for(const k of EN_KEYS){if(x.includes(k))x=x.split(k).join(EN[k]);if(!THAI.test(x))break}return x}
function trNode(n){if(n.nodeType===3){if(n.parentNode&&n.parentNode.closest&&n.parentNode.closest('.nt'))return;const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}
  if(n.nodeType!==1||n.classList.contains('nt'))return;for(const a of['aria-label','title','placeholder','alt'])if(n.hasAttribute(a)){const v=tr(n.getAttribute(a));if(v!==n.getAttribute(a))n.setAttribute(a,v)}
  n.childNodes.forEach(trNode)}
new MutationObserver(ms=>{if(!S||S.lang!=='en')return;for(const m of ms){if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trNode)}}).observe($('stage'),{childList:true,subtree:true,characterData:true});

// battle sounds are synthesised in the browser (no audio files): tones for magic and jingles, filtered noise for blades and impacts
function sfx(kind){if(!S||S.sfx===false)return;try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const A=actx,t=A.currentTime;
  const tone=(type,f0,f1,d,v,at=0)=>{const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.setValueAtTime(f0,t+at);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+at+d);g.gain.setValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.001,t+at+d);o.connect(g).connect(A.destination);o.start(t+at);o.stop(t+at+d+.02)};
  const noise=(d,v,ft,f0,f1,at=0)=>{const n=A.sampleRate*d|0,b=A.createBuffer(1,n,A.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const src=A.createBufferSource(),fl=A.createBiquadFilter(),g=A.createGain();src.buffer=b;fl.type=ft;fl.frequency.setValueAtTime(f0,t+at);fl.frequency.exponentialRampToValueAtTime(f1,t+at+d);g.gain.setValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.001,t+at+d);src.connect(fl).connect(g).connect(A.destination);src.start(t+at)};
  if(kind==='slash'){noise(.16,.22,'bandpass',5200,900);tone('sawtooth',900,200,.1,.04)}
  else if(kind==='smash'){noise(.28,.35,'lowpass',900,90);tone('sine',140,38,.3,.35)}
  else if(kind==='arrow'){noise(.2,.15,'highpass',1800,6500);tone('triangle',520,180,.07,.12)}
  else if(kind==='magic'){tone('square',380,1500,.22,.06);tone('sine',760,2600,.26,.06,.03);noise(.22,.06,'bandpass',2400,5200,.04)}
  else if(kind==='hit'){noise(.09,.3,'lowpass',2400,300);tone('square',210,70,.1,.1)}
  else if(kind==='heal'){[523,659,784,1047].forEach((f,i)=>tone('sine',f,f,.2,.08,i*.07))}
  else if(kind==='ult'){tone('sawtooth',110,880,.5,.07);noise(.5,.08,'bandpass',300,4200)}
  else if(kind==='win'){[523,659,784,1047,1319].forEach((f,i)=>tone('square',f,f,.16,.07,i*.11))}
  else if(kind==='lose'){[392,330,262,196].forEach((f,i)=>tone('triangle',f,f*.97,.28,.1,i*.2))}
  else if(kind==='start'){tone('square',440,440,.09,.07);tone('square',660,660,.14,.07,.1)}
}catch(e){}}
function beep(){if(!S||S.snd===false)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type='square';o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.03);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.1)}catch(e){}}

function gsiInit(){
  const go=()=>{try{google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:r=>{try{const p=JSON.parse(decodeURIComponent(escape(atob(r.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));signIn({sub:p.sub,name:p.given_name||p.name||'Player',email:p.email,pic:p.picture})}catch(e){}}});
    const el=$('gsi');if(el)google.accounts.id.renderButton(el,{theme:'filled_blue',size:'large',shape:'rectangular',text:'signin_with',width:240})}catch(e){gsiFail()}};
  if(window.google&&google.accounts)return go();
  const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=go;sc.onerror=gsiFail;document.head.append(sc)}

const TIPS=['การ์ดได้ Exp เฉพาะใบที่อยู่ในทีมตอนชนะ','ด่านบอสทุก 10 ด่าน ดรอป Gold ทุกครั้ง และมีโอกาสได้เครื่องรางสูงกว่า','การ์ดแต่ละระดับมีเลเวลสูงสุดไม่เท่ากัน','ดู Lv แนะนำในหน้าเลือกด่านก่อนเข้าสู้','การเทรดคือการให้ของ ต้องยืนยันว่าเป็นผู้ส่งหรือผู้รับทุกครั้ง'];
// loading screen: really preloads every card, fighter and the next map so nothing pops in during play
function loading(){
  const next=Math.min(MAXST,S.cleared+1),list=['chars.png',mapImg(next),...Object.keys(C).flatMap(id=>[img(id),`spr/${id}.webp`])];
  view(`<div class="loadv" style="--bg:url(${COVER_BG})"><div class="cbg"></div>
   <h1 class="logo nt">PIXELDECK<b>BATTLE</b></h1>
   <div class="lrun">${(S.team.length?S.team:GIFT).map((id,i)=>`<img src="spr/${id}.webp" alt="" style="--d:${-i*.17}s">`).join('')}</div>
   <div class="lbar"><i id="lbi"></i></div><p class="lpct nt" id="lpc">0%</p>
   <p class="ltip">${TIPS[Math.floor(Math.random()*TIPS.length)]}</p></div>`);
  let done=0,fin=false;const t0=performance.now(),total=list.length;
  const end=()=>{if(fin)return;fin=true;setTimeout(()=>{if($('lbi'))(S.gift?home():welcome())},Math.max(250,1400-(performance.now()-t0)))};
  const tick=()=>{done++;const b=$('lbi'),p=$('lpc'),v=Math.round(done/total*100);if(b)b.style.width=v+'%';if(p)p.textContent=v+'%';if(done>=total)end()};
  let k=0;const pump=()=>{if(k>=total)return;const im=new Image();im.onload=im.onerror=()=>{tick();pump()};im.src=list[k++]};
  for(let i=0;i<6;i++)pump();setTimeout(()=>{const b=$('lbi');if(b)b.style.width='100%';end()},12000);
}
function fit(){const w=innerWidth,h=innerHeight,p=h>w,s=$('stage');s.style.width=(p?h:w)+'px';s.style.height=(p?w:h)+'px';s.style.setProperty('--H',(p?w:h)+'px');s.style.transform=p?'rotate(90deg) translateY(-100%)':'none'}
fit();addEventListener('resize',fit);
S=load();try{const l=localStorage.getItem('pdb_lang');if(l&&!USER)S.lang=l}catch(e){}document.documentElement.lang=S.lang||'th';USER?loading():titleScreen();
</script>
