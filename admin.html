<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Pixeldeck Admin</title>
<link rel="manifest" href="admin.webmanifest"><link rel="icon" href="admin-192.png"><link rel="apple-touch-icon" href="admin-192.png"><meta name="theme-color" content="#101425"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0d1226;--pn:#161d3c;--ln:#2c3768;--tx:#e9edff;--mu:#9aa6d6;--gd:#ffd84a;--gr:#5fe36a;--rd:#ff7a6b;--bl:#6fd8ff}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-family:system-ui,"Noto Sans Thai","Loma",sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:#0a0e20;border-bottom:1px solid var(--ln);padding:8px 12px;display:flex;align-items:center;gap:8px}
header b{font-size:17px;color:var(--gd)}header small{color:var(--mu);margin-left:auto;font-size:12px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 12px;position:sticky;top:44px;z-index:4;background:var(--bg)}
nav button{padding:9px 2px;border-radius:9px;border:1px solid var(--ln);background:var(--pn);color:var(--mu);font-weight:700;font-size:14px}
nav button.on{background:#2b3a8c;color:#fff;border-color:var(--gd)}
main{padding:4px 12px 60px;max-width:900px;margin:0 auto}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:16px;color:var(--gd)}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kp div{background:#0f1530;border-radius:10px;padding:10px;text-align:center}.kp b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.kp small{color:var(--mu)}
button,.btn{font:inherit;cursor:pointer}.b{padding:9px 14px;border-radius:9px;border:0;background:#3556d8;color:#fff;font-weight:700}.b.g{background:#1f8a3b}.b.r{background:#b3261e}.b.s{background:#2a3566}.b:disabled{opacity:.45}
input,textarea,select{font:inherit;width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--ln);background:#0f1530;color:var(--tx)}textarea{min-height:64px}
label{display:block;margin:8px 0 3px;color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>.fx{flex:none}
.sw{display:flex;align-items:center;gap:10px;justify-content:space-between}.tg{flex:none;width:58px;height:32px;border-radius:16px;border:0;background:#39406a;position:relative}.tg i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}.tg.on{background:#1f8a3b}.tg.on i{left:29px}.tg.red.on{background:#b3261e}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 5px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}th{color:var(--mu);font-weight:600;white-space:nowrap}td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}.mu{color:var(--mu)}.ok{color:var(--gr)}.er{color:var(--rd)}.gd{color:var(--gd)}.bl{color:var(--bl)}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11.5px;font-weight:700;background:#5a1d1d;color:#ffc9c2;margin:1px 2px 1px 0;white-space:nowrap}.chip.b2{background:#1d3a5a;color:#bfe6ff}.chip.g2{background:#4a3d0f;color:#ffe9a0}.o2{background:#5a2a0a;color:#ffc48a}
.fl{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.fl button{padding:5px 10px;border-radius:14px;border:1px solid var(--ln);background:#0f1530;color:var(--mu);font-size:13px}.fl button.on{background:#2b3a8c;color:#fff}
tr.pl{cursor:pointer}tr.pl:active{background:#202a58}.msg{margin:8px 0;font-weight:700}code{background:#0f1530;padding:1px 5px;border-radius:5px;font-size:12px;word-break:break-all}
#login{display:grid;place-content:center;justify-items:center;gap:14px;min-height:70vh;text-align:center;padding:20px}
a{color:var(--bl)}
</style></head><body>
<header><b>Pixeldeck Admin</b><small id="who"></small><button class="b s" id="out" style="padding:5px 10px;font-size:12px" hidden>ออก</button></header>
<div id="login"><h2 style="margin:0">หลังบ้าน Pixeldeck Battle</h2><p class="mu" style="margin:0">เข้าได้เฉพาะบัญชีเจ้าของเกม</p><button class="b" id="gin">ล็อกอินด้วย Google</button><p id="lmsg" class="er"></p></div>
<nav id="nav" hidden><button data-t="ov" class="on">ภาพรวม</button><button data-t="sw">สวิตช์</button><button data-t="fi">การเงิน</button><button data-t="pl">ผู้เล่น</button></nav>
<main id="main" hidden></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
'use strict';
/* Pixeldeck Battle - owner's admin page. This page is public; it has no power of its own. Every read and write below is allowed or refused
   by the Firestore rules, which let only the owner's Google account see other players' saves, the slip ledger and adminlog, and write config/main. */
const FB_CFG={"apiKey": "AIzaSyBxPtaSzWfEWeLUZffrgB5cbr1Mhtdpj7M", "authDomain": "pixeldeck-battle-1a625.firebaseapp.com", "projectId": "pixeldeck-battle-1a625", "storageBucket": "pixeldeck-battle-1a625.firebasestorage.app", "messagingSenderId": "520020450750", "appId": "1:520020450750:web:c54dadd6f487038ab22def", "databaseURL": "https://pixeldeck-battle-1a625-default-rtdb.asia-southeast1.firebasedatabase.app"},CARDS={"h06": ["Bone Raider", "ST"], "h20": ["Goblin Scrapper", "ST"], "h11": ["Stone Golem", "ST"], "h17": ["Goblin Berserker", "C"], "h12": ["Vampire Bat", "C"], "h01": ["Magma Golem", "C"], "h02": ["Leaf Ronin", "UC"], "h16": ["Elder Treant", "UC"], "h21": ["Sylvan Archer", "UC"], "h05": ["Soul Reaper", "R"], "h09": ["Lion Paladin", "R"], "h10": ["Frost Fenrir", "R"], "h08": ["Shadow Ninja", "R"], "h15": ["Glacier Sage", "L"], "h13": ["Crimson Lord", "L"], "h14": ["Scarlet Griffin", "L"], "h19": ["Inferno Drake", "L"], "h04": ["Frost Empress", "L"], "h03": ["Zeus", "SL"], "h22": ["Wukong", "SL"], "h07": ["Seraphina", "SL"], "h18": ["Aurum Hydra", "LT"], "h23": ["Ember Witch", "C"], "h24": ["Storm Shaman", "UC"], "h25": ["Ironbark Guardian", "UC"], "h26": ["Obsidian Colossus", "L"], "h27": ["Aegis Valkyrie", "SL"], "h28": ["Glacius Rex", "LT"], "h29": ["Vanarin", "SL"], "h30": ["Tenface Asura", "SL"], "h31": ["Indigo Dragonsteed", "SL"], "h34": ["Temple Yaksha", "L"]},AMS={"tiger": ["เขี้ยวเสือ", "R"], "turtle": ["กระดองเต่า", "R"], "hawk": ["ตาเหยี่ยว", "R"], "rock": ["หินผา", "R"], "dagger": ["มีดนักฆ่า", "R"], "dragon": ["หัวใจมังกร", "L"], "ruby": ["ทับทิมโลหิต", "L"], "feather": ["ขนนกเทวา", "L"], "kfang": ["เขี้ยวราชันย์", "SL"], "dscale": ["เกราะมังกรเทพ", "SL"], "deye": ["เนตรมรณะ", "SL"], "seraph": ["ปีกเซราฟ", "SL"], "grove": ["มรกตพฤกษา", "SL"], "lion": ["หัวใจราชสีห์", "SL"], "gstar": ["ดาราพิทักษ์", "SL"], "hallow": ["โคมวิญญาณฟักทอง", "LT"], "clover": ["Lucky Clover", "LT"]},BUILD='b209';
firebase.initializeApp(FB_CFG);const db=firebase.firestore(),FV=firebase.firestore.FieldValue,$=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=v=>(+v||0).toLocaleString('en'),ms=v=>!v?0:v.toMillis?v.toMillis():+v||Date.parse(v)||0;
const dt=v=>{const m=ms(v);return m?new Date(m).toLocaleString('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'-'};
const ago=v=>{const m=Date.now()-ms(v);if(!ms(v))return '-';const mi=Math.floor(m/6e4);return mi<1?'เมื่อกี้':mi<60?mi+' นาที':mi<1440?Math.floor(mi/60)+' ชม.':Math.floor(mi/1440)+' วัน'};
const dayStart=(back=0)=>{const d=new Date(Date.now()+7*36e5);d.setUTCHours(0,0,0,0);return new Date(d.getTime()-7*36e5-back*864e5)};
const cnt=q=>typeof q.count==='function'?q.count().get().then(r=>r.data().count):q.get().then(r=>r.size);
let me=null,tab='ov',cfg={},slips=null,alog=null,players=null,pf={q:'',f:'all',s:'seen'},sel=null,busy=false;
const say=(t,cls='ok')=>{const m=$('msg');if(m){m.className='msg '+cls;m.textContent=t}};
const fail=e=>say('ไม่สำเร็จ: '+(e&&(e.code||e.message)||e),'er');

$('gin').onclick=()=>firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{$('lmsg').textContent='ล็อกอินไม่สำเร็จ: '+(e.code||e.message)});
$('out').onclick=()=>firebase.auth().signOut();
firebase.auth().onAuthStateChanged(u=>{me=u;$('who').textContent=u?u.email:'';$('out').hidden=!u;
  if(!u){$('login').hidden=false;$('nav').hidden=$('main').hidden=true;return}
  // the only real check is the rules: an account that is not the owner cannot read adminlog
  db.collection('adminlog').limit(1).get().then(()=>{$('login').hidden=true;$('nav').hidden=$('main').hidden=false;go('ov')})
   .catch(e=>{$('lmsg').textContent=e.code==='permission-denied'?'บัญชี '+u.email+' ไม่มีสิทธิ์เข้าหลังบ้าน (หรือยังไม่ได้วางกฎ Firestore ชุดใหม่)':'เชื่อมต่อไม่ได้: '+(e.code||e.message)})});
$('nav').onclick=e=>{const t=e.target.dataset.t;if(t)go(t)};
function go(t){tab=t;sel=null;[...$('nav').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));({ov,sw,fi,pl})[t]()}
const put=h=>{$('main').innerHTML=h};
const loadCfg=()=>db.collection('config').doc('main').get().then(d=>{cfg=d.exists?d.data()||{}:{};return cfg});
const loadSlips=()=>db.collection('slips').orderBy('at','desc').limit(500).get().then(q=>slips=q.docs.map(d=>({id:d.id,...d.data()})));
const loadLog=()=>db.collection('adminlog').orderBy('at','desc').limit(300).get().then(q=>alog=q.docs.map(d=>({id:d.id,...d.data()})));
const logIt=o=>db.collection('adminlog').add({...o,by:me.email,at:FV.serverTimestamp()}).catch(()=>{});

/* ---------- overview ---------- */
function ov(){put('<div class="card"><h3>ภาพรวม</h3><p class="mu">กำลังโหลด…</p></div>');
  const on=cnt(db.collection('online').where('at','>',new Date(Date.now()-15*6e4))),all=cnt(db.collection('saves')),td=cnt(db.collection('saves').where('at','>=',dayStart())),wk=cnt(db.collection('saves').where('at','>=',dayStart(6)));
  Promise.all([on,all,td,wk,loadSlips(),loadCfg()]).then(([on,all,td,wk])=>{const sum=(from)=>slips.filter(s=>ms(s.at)>=from).reduce((a,s)=>[a[0]+(+s.thb||0),a[1]+1],[0,0]),a=sum(dayStart().getTime()),b=sum(dayStart(6).getTime()),c=sum(0);
    put(`${cfg.maint?'<div class="card" style="border-color:var(--rd)"><b class="er">🔧 ตอนนี้เกมปิดปรับปรุงอยู่</b></div>':''}
    <div class="card"><h3>ผู้เล่น</h3><div class="kp"><div><b class="ok">${N(on)}</b><small>ออนไลน์ตอนนี้ (15 นาที)</small></div><div><b>${N(all)}</b><small>บัญชีทั้งหมด</small></div><div><b>${N(td)}</b><small>เข้าเล่นวันนี้</small></div><div><b>${N(wk)}</b><small>เข้าเล่น 7 วัน</small></div></div></div>
    <div class="card"><h3>ยอดเติมเงิน (จากสลิปที่ระบบตรวจผ่าน)</h3><div class="kp"><div><b class="gd">฿${N(a[0])}</b><small>วันนี้ · ${a[1]} รายการ</small></div><div><b class="gd">฿${N(b[0])}</b><small>7 วัน · ${b[1]} รายการ</small></div><div style="grid-column:1/3"><b class="gd">฿${N(c[0])}</b><small>ทั้งหมด · ${c[1]} รายการ${slips.length>=500?' (นับ 500 รายการล่าสุด)':''}</small></div></div>
     <p class="mu" style="margin:8px 0 0;font-size:13px">ไม่รวมเพชรที่ส่งมือ · เทียบกับยอดเข้าบัญชีธนาคารจริงเสมอ</p></div>
    <div class="card"><h3>ทางลัด</h3><p style="margin:0;line-height:2"><a href="https://console.firebase.google.com/project/${esc(FB_CFG.projectId)}/firestore/usage" target="_blank" rel="noopener">โควตาฐานข้อมูล (Firebase Usage)</a><br><a href="https://developer.thunder.in.th" target="_blank" rel="noopener">โควตาตรวจสลิป (Thunder)</a><br><a href="https://dash.cloudflare.com" target="_blank" rel="noopener">Worker เติมเพชร (Cloudflare)</a><br><a href="./" target="_blank" rel="noopener">เปิดเกม</a></p>
     <p class="mu" style="margin:8px 0 0;font-size:12px">Admin ${esc(BUILD)} · เปิดหน้านี้ 1 ครั้งใช้การอ่านฐานข้อมูลประมาณ ${N(slips.length+6)} ครั้ง</p></div>`)}).catch(e=>put('<div class="card"><p class="er">โหลดไม่ได้: '+esc(e.code||e.message)+'</p></div>'))}

/* ---------- switches ---------- */
function sw(){put('<div class="card"><p class="mu">กำลังโหลด…</p></div>');loadCfg().then(swDraw).catch(e=>put('<div class="card"><p class="er">'+esc(e.code||e.message)+'</p></div>'))}
function swDraw(){const p=cfg.pay||{},h=Array.isArray(p.h)?p.h:[17,24],hs=v=>Array.from({length:25},(_,i)=>`<option value="${i}" ${i===v?'selected':''}>${String(i%24).padStart(2,'0')}:00${i===24?' (เที่ยงคืน)':''}</option>`).join('');
  put(`<p id="msg" class="msg"></p>
  <div class="card"><h3>🔧 ปิดปรับปรุง</h3><div class="sw"><span>ผู้เล่นทุกคนเห็นหน้าปิดปรับปรุง เล่นไม่ได้<br><small class="mu">บัญชี Dev ของคุณยังเข้าเล่นได้</small></span><button class="tg red ${cfg.maint?'on':''}" id="tmt"><i></i></button></div>
   <label>ข้อความที่ผู้เล่นเห็น (เว้นว่าง = ข้อความมาตรฐาน)</label><textarea id="mmsg" maxlength="400">${esc(cfg.maintMsg||'')}</textarea><button class="b" data-a="mt" style="margin-top:8px">บันทึกข้อความ</button></div>
  <div class="card"><h3>📢 ประกาศในเกม</h3><label>ขึ้นแถบบนหน้าล็อบบี้ของทุกคน (เว้นว่าง = ไม่มีประกาศ) สูงสุด 160 ตัวอักษร</label><textarea id="ntc" maxlength="160">${esc(cfg.notice||'')}</textarea><button class="b" data-a="nt" style="margin-top:8px">บันทึกประกาศ</button></div>
  ${(()=>{const g=cfg.gift,on=!!(g&&g.id&&g.days>0&&Date.now()<(+g.to||0)),d0=new Date();d0.setDate(d0.getDate()+1);d0.setHours(0,0,0,0);const f=on?+g.from:d0.getTime(),t=on?+g.to:d0.getTime()+864e5-6e4,loc=m=>{const d=new Date(m-new Date(m).getTimezoneOffset()*6e4);return d.toISOString().slice(0,16)},VN=['','Bronze','Silver','Gold'];
   return `<div class="card"><h3>👑 แจก VIP ให้ทุกคนที่ล็อกอิน</h3><p style="margin:0 0 6px">สถานะ: ${on?`<b class="ok" style="color:var(--gr)">${Date.now()<f?'ตั้งไว้แล้ว รอเวลาเริ่ม':'กำลังแจกอยู่'}</b> · VIP ${VN[g.tier]||'?'} ${N(g.days)} วัน · ${dt(f)} → ${dt(t)}`:'<span class="mu">ยังไม่ได้ตั้ง</span>'}</p>
   <div class="row"><select id="gt">${[1,2,3].map(i=>`<option value="${i}" ${(on?g.tier:1)==i?'selected':''}>VIP ${VN[i]}</option>`).join('')}</select><input id="gd" type="number" min="1" max="60" value="${on?g.days:7}" style="max-width:90px"><span class="fx">วัน</span></div>
   <label>เริ่มแจก (เวลาในเครื่องนี้)</label><input id="gf" type="datetime-local" value="${loc(f)}"><label>สิ้นสุด</label><input id="gu" type="datetime-local" value="${loc(t)}">
   <div class="row" style="margin-top:8px"><button class="b" data-a="gset">${on?'บันทึกเป็นการแจกรอบใหม่':'ตั้งแจก'}</button>${on?'<button class="b r" data-a="goff">ยกเลิกการแจก</button>':''}</div>
   <p class="mu" style="margin:6px 0 0;font-size:13px">ผู้เล่นที่ล็อกอิน Google แล้วเข้าล็อบบี้ในช่วงเวลานี้ได้ VIP 1 ครั้งต่อรอบ · บันทึกใหม่ = รอบใหม่ คนที่รับรอบเก่าแล้วจะได้อีก · ยกเลิกแล้วไม่ดึงคืนจากคนที่รับไปแล้ว</p></div>`})()}
  <div class="card"><h3>💎 ระบบเติมเพชร</h3><div class="sw"><span>เปิดรับเติมเพชรด้วยสลิป</span><button class="tg ${p.on===false?'':'on'}" id="tpay"><i></i></button></div>
   <label>เวลาเปิดรับ (เวลาไทย)</label><div class="row"><select id="h0">${hs(h[0])}</select><span class="fx">ถึง</span><select id="h1">${hs(h[1])}</select></div><button class="b" data-a="ph" style="margin-top:8px">บันทึกเวลา</button></div>
  ${(()=>{const d=Object.assign({on:true,lim:100,tax:5,vtax:3,st:30},cfg.dm||{});return `<div class="card"><h3>📈 ตลาดเพชร</h3><div class="sw"><span>เปิดตลาดเพชร (ซื้อขายเพชรด้วย Gold)<br><small class="mu">ปิดแล้วผู้เล่นซื้อขายใหม่ไม่ได้ คำสั่งที่ค้างอยู่ยังยกเลิกคืนได้ตอนเปิดอีกครั้ง</small></span><button class="tg ${d.on===false?'':'on'}" id="tdm"><i></i></button></div>
   <label>ซื้อได้ต่อวัน และขายได้ต่อวัน ต่อบัญชี (เพชร) · VIP ได้ 2 เท่า</label><input id="dml" type="number" min="1" max="1000" value="${+d.lim||100}">
   <div class="row"><div style="flex:1"><label>ภาษีผู้ขาย %</label><input id="dmt" type="number" min="0" max="10" value="${+d.tax}"></div><div style="flex:1"><label>ภาษี VIP %</label><input id="dmv" type="number" min="0" max="10" value="${+d.vtax}"></div></div>
   <label>ผ่านด่านขั้นต่ำก่อนใช้ตลาดเพชร</label><input id="dms" type="number" min="0" max="1100" value="${+d.st}">
   <button class="b" data-a="dm" style="margin-top:8px">บันทึกตลาดเพชร</button>

function cpBox(){return `<div class="card" style="border-color:var(--gd)"><h3>🎁 ส่งของชดเชยด้วยรหัสผู้เล่น</h3><label>รหัสผู้เล่น (ผู้เล่นคัดลอกได้ที่หน้าเติมเพชรในเกม ปุ่ม คัดลอก ข้างรหัสผู้เล่น)</label>
  <div class="fl"><input id="cpuid" placeholder="วางรหัสผู้เล่น" value="${esc(cpP?cpP.id:'')}" style="flex:1;min-width:0"><button class="b" id="cpchk">ตรวจรหัส</button></div><p id="msg" class="msg"></p>
  ${cpMsg?`<p class="msg er" style="margin:6px 0 0">${esc(cpMsg)}</p>`:''}${cpP?`<p style="margin:8px 0 0;font-size:16px">✅ ชื่อในเกม: <b class="gd" style="font-size:19px">${esc(cpP.name)}</b><br><span class="mu" style="font-size:13px">ด่าน ${N(cpP.cleared)} · การ์ด ${N(cpP.nc)} ใบ · เล่นล่าสุด ${dt(cpP.seen)} · ตรวจชื่อให้ตรงก่อนส่ง</span></p>`:'<p class="mu" style="font-size:12.5px;margin:6px 0 0">ใส่รหัสแล้วกด ตรวจรหัส ชื่อในเกมจะขึ้นให้ดูก่อน จากนั้นจึงเลือกของที่จะส่ง · ใช้การอ่านฐานข้อมูล 1 ครั้ง ไม่ต้องโหลดรายชื่อทั้งหมด</p>'}</div>${cpP?compCard(cpP):''}`}
function cpLook(uid){uid=String(uid||'').trim();cpMsg='';if(!uid||/[\/\s]/.test(uid)){cpP=null;cpMsg=uid?'รหัสไม่ถูกต้อง (มีช่องว่างหรือเครื่องหมาย /)':'ใส่รหัสผู้เล่นก่อน';return pl()}say('กำลังตรวจ…');
  return Promise.all([db.collection('saves').doc(uid).get(),loadCfg()]).then(([d])=>{if(!d.exists){cpP=null;cpMsg='ไม่พบรหัสนี้ ตรวจว่าคัดลอกมาครบทุกตัว'}else cpP=digest(uid,d.data());pl()}).catch(e=>{cpP=null;cpMsg='ตรวจไม่ได้: '+(e&&(e.code||e.message)||e);pl()})}
function cpWire(){if(!$('cpchk'))return;$('cpchk').onclick=()=>cpLook($('cpuid').value);$('cpuid').onkeydown=e=>{if(e.key==='Enter')cpLook($('cpuid').value)};if(cpP)compWire(cpP,()=>cpLook(cpP.id))}
function plOne(id){const p=players.find(x=>x.id===id);if(!p){sel=null;return plDraw()}const bans=cfg.bans||{},ban=bans[id],cs=Object.keys(p.cards).filter(c=>CARDS[c]).sort((a,b)=>RK.indexOf(CARDS[a][1])-RK.indexOf(CARDS[b][1])||(p.cards[b].lv||0)-(p.cards[a].lv||0));
  put(`<p id="msg" class="msg"></p><div class="card"><button class="b s" id="back">← กลับรายชื่อ</button>
   <h3 style="margin-top:10px">${esc(p.name)} ${ban?'<span class="chip">ถูกระงับ</span>':''}</h3><p style="margin:0">รหัสผู้เล่น <code>${esc(p.id)}</code><br><span class="mu">เข้าเล่นล่าสุด ${dt(p.seen)} (${ago(p.seen)}) · เฟส ${p.era} · ภาษา ${esc(p.lang)}${p.tut?' · ยังอยู่ในสอนเล่น':''}</span></p>
   ${p.fl.length?`<div style="margin-top:8px">${p.fl.map(f=>`<p style="margin:3px 0"><span class="chip">${esc(f[0])}</span> ${esc(f[1])}</p>`).join('')}</div>`:'<p class="ok" style="margin:8px 0 0">ไม่มีข้อสังเกต</p>'}</div>
  <div class="card"><h3>ทรัพยากร</h3><div class="kp"><div><b class="bl">${N(p.dia)}</b><small>เพชร</small></div><div><b class="gd">${N(p.gold)}</b><small>Gold</small></div><div><b>${N(p.ac)}</b><small>เหรียญอารีน่า</small></div><div><b>${N(p.dp)}</b><small>แต้มย่อย</small></div><div><b>${p.cleared}</b><small>ด่านที่ผ่าน</small></div><div><b>${p.vip?'ระดับ '+p.vip:'-'}</b><small>VIP${p.vip?' · หมด '+dt(p.vipEnd):''}</small></div></div>
   <p class="mu" style="margin:8px 0 0">PvP: ดาว ${N(p.pv.st||0)} · ชนะ ${N(p.pv.w||0)} · แพ้ ${N(p.pv.l||0)}</p><p class="mu" style="margin:4px 0 0">หอคอย: ${p.tw?`ชั้น ${N(p.tw.f||0)} (ซีซั่น ${Math.max(1,(p.tw.w||0)-TW_W0+1)})`:'ยังไม่เคยเข้า'} · โล่ ${p.sh.length?p.sh.map(c=>`<code>${esc(c)}</code>`).join(' '):'ไม่มี'} · จดหมายค้างรับ ${N(p.mail)}</p></div>
  <div class="card"><h3>ชวนเพื่อน ${p.fd?'<span class="chip g2">FOUNDER</span>':''}</h3><p style="margin:0 0 6px" class="mu">${p.rf?'บัญชีนี้ถูกชวนโดย <code>'+esc(p.rf)+'</code> · ':''}รับเพชรจากการชวนแล้ว ${N(p.rfn)} คน</p><div id="rfl"><p class="mu" style="margin:0">กำลังโหลดรายชื่อเพื่อนที่ชวน…</p></div></div>
  ${goldCard(p)}
  ${srcCard(p)}
  <div class="card"><h3>การ์ด ${p.nc} ชนิด</h3><p style="margin:0 0 6px">${RK.filter(r=>p.rk[r]).map(r=>`<span class="chip ${r==='LT'||r==='SL'?'':'b2'}">${r} ${p.rk[r]}</span>`).join('')}${p.evLT?` <span class="chip g2">Limited อีเวนต์ ${p.evLT}</span>`:''}</p>
   <div class="tw"><table><tr><th>การ์ด</th><th>ระดับ</th><th>Lv</th><th>ดาว</th><th>ใบซ้ำ</th><th>ทีม</th></tr>${cs.map(c=>`<tr><td>${esc(CARDS[c][0])}</td><td>${esc(CARDS[c][1])}</td><td class="n">${N(p.cards[c].lv)}</td><td class="n">${p.cards[c].star||''}</td><td class="n">${p.cards[c].cp||''}</td><td>${p.team.includes(c)?'✓':''}</td></tr>`).join('')}</table></div>
   ${Object.keys(p.ev).length?`<p class="mu" style="margin:8px 0 0">การ์ดอีเวนต์ (Limited Pack): ${Object.keys(p.ev).filter(c=>p.ev[c]>0).map(c=>esc((CARDS[c]||[c])[0])+' ×'+p.ev[c]).join(', ')}</p>`:''}</div>
  <div class="card"><h3>เครื่องราง</h3><p style="margin:0">${Object.keys(p.am).filter(k=>p.am[k]>0).map(k=>`<span class="chip ${(AMS[k]||[])[1]==='SL'?'o2':(AMS[k]||[])[1]==='L'?'g2':'b2'}">${esc((AMS[k]||[k])[0])} ×${N(p.am[k])}</span>`).join('')||'<span class="mu">ไม่มี</span>'}</p></div>
  <div class="card"><h3>ประวัติเติมในเซฟ (${p.pay.length})</h3>${p.pay.length?`<div class="tw"><table><tr><th>เวลา</th><th>💎</th><th>อ้างอิง</th></tr>${p.pay.slice().reverse().map(x=>`<tr><td>${dt(x.t)}</td><td class="n">${N(x.d)}</td><td><code>${esc(x.id||'')}</code></td></tr>`).join('')}</table></div>`:'<p class="mu" style="margin:0">ไม่เคยเติม</p>'}</div>
  ${compCard(p)}
  <div class="card" style="border-color:${ban?'var(--gr)':'var(--rd)'}"><h3>${ban?'ปลดระงับบัญชี':'ระงับบัญชี'}</h3>${ban?`<p style="margin:0 0 8px">เหตุผลที่ระงับ: ${esc(ban===true?'-':ban)}</p><button class="b g" id="unban">ปลดระงับ</button>`:`<label>เหตุผล (ผู้เล่นจะเห็นข้อความนี้)</label><input id="breason" maxlength="120" placeholder="เช่น แก้ไขเซฟ / ใช้บั๊ก"><button class="b r" id="ban" style="margin-top:8px">ระงับบัญชีนี้</button>`}
   <p class="mu" style="font-size:12.5px;margin:8px 0 0">มีผลภายในประมาณ 10 นาที · เป็นการกันฝั่งเกม ผู้เล่นทั่วไปเข้าไม่ได้ แต่ไม่ใช่กำแพงที่เจาะไม่ได้สำหรับคนที่แก้โค้ดเป็น</p></div>`);
  $('back').onclick=()=>{sel=null;plDraw()};
  db.collection('refs').where('to','==',id).get().then(q=>{const L=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>ms(a.at)-ms(b.at)),box=$('rfl');if(!box||sel!==id)return;
    const span=L.length>1?ms(L[L.length-1].at)-ms(L[0].at):0,fast=L.length>=3&&span<2*36e5;
    box.innerHTML=L.length?`${fast?'<p style="margin:0 0 6px"><span class="chip">ผิดสังเกต</span> เพื่อนทั้งหมดผ่านเงื่อนไขภายใน '+Math.max(1,Math.round(span/6e4))+' นาที</p>':''}<div class="tw"><table><tr><th>เพื่อน</th><th>ผ่านด่าน 10 เมื่อ</th><th>รับรางวัล</th></tr>${L.map(x=>{const f=players.find(y=>y.id===x.id);return `<tr><td>${esc(x.name||'?')}${f?' <span class="mu">ด่าน '+f.cleared+'</span>':''}<br><code style="font-size:11px">${esc(x.id)}</code></td><td>${dt(ms(x.at))}</td><td>${x.claimed?'✓':'–'}</td></tr>`}).join('')}</table></div>`:'<p class="mu" style="margin:0">ยังไม่มีเพื่อนที่ผ่านเงื่อนไข</p>'}).catch(e=>{const box=$('rfl');if(box)box.innerHTML='<p class="er" style="margin:0">โหลดไม่ได้: '+esc(e.code||e.message)+'</p>'});
  compWire(p);
  if($('ban'))$('ban').onclick=()=>{const r=$('breason').value.trim()||'ผิดกติกา';if(!confirm('ระงับบัญชี '+p.name+' ?'))return;db.collection('config').doc('main').set({bans:{[id]:r}},{merge:true}).then(()=>{logIt({t:'ban',to:id,note:r});return loadCfg()}).then(()=>{plOne(id);say('ระงับแล้ว')}).catch(fail)};
  if($('unban'))$('unban').onclick=()=>{db.collection('config').doc('main').update({['bans.'+id]:FV.delete()}).then(()=>{logIt({t:'unban',to:id});return loadCfg()}).then(()=>{plOne(id);say('ปลดระงับแล้ว')}).catch(fail)}}
</script></body></html>
